name: Repair WP069C patch build environment

on:
  push:
    branches:
      - agent/wp069c-complete-relationship-localization
    paths:
      - '.github/workflows/fix-wp069c-patch-build-env.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Add safe build placeholders and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          target = Path('.github/workflows/patch-wp069c-complete-relationship-localization.yml')
          source = target.read_text(encoding='utf-8')
          before = '          npm run build:cloudflare\n'
          after = "          SUPABASE_URL=https://example.supabase.co SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_only_placeholder_00000000000000000000 npm run build:cloudflare\n"
          if source.count(before) != 1:
              raise RuntimeError('expected one Cloudflare build command')
          target.write_text(source.replace(before, after, 1), encoding='utf-8')
          Path('.github/workflows/fix-wp069c-patch-build-env.yml').unlink()
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix WP-069C patch build environment'
          git push origin "HEAD:${GITHUB_REF_NAME}"
