name: Verify WP072 contact entitlement flow

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-wp072-contact-entitlement.yml'
      - 'apps/private-preview/contact-entitlement-model.js'
      - 'apps/private-preview/conversation-inbox-controller.js'
      - 'apps/private-preview/product-shell.js'
      - 'apps/private-preview/product-model.js'
      - 'apps/web/tests/contact-entitlement-flow.test.mjs'
      - 'supabase/migrations/20260805194500_private_proof_entitlement_terms_alignment.sql'
      - 'supabase/tests/database/006_private_proof_interaction.test.sql'
      - 'scripts/build-private-preview.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_run:
    workflows: ['Configure Cloudflare staging backend']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendezvue-wp072-contact-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate entitlement activation contract
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Test client contract and generated artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test apps/web/tests/contact-entitlement-flow.test.mjs
          npm run build:cloudflare

          for file in apps/private-preview/product-shell.js dist-private-preview/product-shell.js; do
            grep --fixed-strings --quiet 'createConversationInboxController' "$file"
            grep --fixed-strings --quiet 'conversation-inbox-controller.js' "$file"
            grep --fixed-strings --quiet 'contact-entitlement-model.js' "$file"
          done

          for file in apps/private-preview/conversation-inbox-controller.js dist-private-preview/conversation-inbox-controller.js; do
            grep --fixed-strings --quiet 'claim_private_proof_entitlement' "$file"
            grep --fixed-strings --quiet 'contact entitlement activation' "$file"
            grep --fixed-strings --quiet 'open_match_conversation' "$file"
            grep --fixed-strings --quiet 'contactOpenErrorMessage(error, getLanguage())' "$file"
          done

          for file in apps/private-preview/contact-entitlement-model.js dist-private-preview/contact-entitlement-model.js; do
            grep --fixed-strings --quiet 'Het eenmalige test-contactrecht is al gebruikt of niet meer geldig.' "$file"
            grep --fixed-strings --quiet 'The one-time test contact right has already been used or is no longer valid.' "$file"
          done

          grep --fixed-strings --quiet "'synthetic-product-2026-08'" supabase/migrations/20260805194500_private_proof_entitlement_terms_alignment.sql
          grep --fixed-strings --quiet "'synthetic-proof-2026-07'" supabase/migrations/20260805194500_private_proof_entitlement_terms_alignment.sql

  canonical:
    name: Verify canonical entitlement client
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      STAGING_URL: https://rendezvue-private-preview.pages.dev/
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Wait for commit-matched canonical deployment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo '::error title=Invalid commit::EXPECTED_SHA is not a full Git commit.'
            exit 1
          }

          metadata="$RUNNER_TEMP/deployment.json"
          matched=false
          for attempt in {1..72}; do
            status="$(curl --silent --show-error --location \
              --output "$metadata" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}deployment.json?commit=${EXPECTED_SHA}&run=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            if [[ "$status" == "200" ]] && node --input-type=module --eval "
              import { readFileSync } from 'node:fs';
              const document = JSON.parse(readFileSync(process.argv[1], 'utf8'));
              if (document.buildCommit !== process.argv[2]) process.exit(1);
              if (document.hostingPlatform !== 'cloudflare-pages') process.exit(1);
              if (document.remoteBackendConfigured !== true) process.exit(1);
              if (document.realUserAdmissionAuthorized !== false) process.exit(1);
            " "$metadata" "$EXPECTED_SHA"; then
              matched=true
              break
            fi
            echo "Canonical metadata is not commit-matched yet (attempt ${attempt}, HTTP ${status})."
            sleep 10
          done

          [[ "$matched" == "true" ]] || {
            echo '::error title=Deployment did not converge::Canonical deployment metadata was not commit-matched within the bounded verification window.'
            exit 1
          }

      - name: Verify delivered entitlement flow
        shell: bash
        run: |
          set -euo pipefail
          shell_file="$RUNNER_TEMP/product-shell.js"
          controller_file="$RUNNER_TEMP/conversation-inbox-controller.js"
          model_file="$RUNNER_TEMP/contact-entitlement-model.js"
          verified=false

          check_marker() {
            local file="$1"
            local marker="$2"
            local label="$3"
            if ! grep --fixed-strings --quiet "$marker" "$file"; then
              echo "Missing ${label}: ${marker}"
              return 1
            fi
          }

          for attempt in {1..24}; do
            cache_key="commit=${EXPECTED_SHA}&run=${GITHUB_RUN_ID}&attempt=${attempt}"
            shell_status="$(curl --silent --show-error --location \
              --output "$shell_file" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}product-shell.js?${cache_key}" || true)"
            controller_status="$(curl --silent --show-error --location \
              --output "$controller_file" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}conversation-inbox-controller.js?${cache_key}" || true)"
            model_status="$(curl --silent --show-error --location \
              --output "$model_file" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}contact-entitlement-model.js?${cache_key}" || true)"

            failed=false
            [[ "$shell_status" == "200" ]] || {
              echo "product-shell.js returned HTTP ${shell_status}."
              failed=true
            }
            [[ "$controller_status" == "200" ]] || {
              echo "conversation-inbox-controller.js returned HTTP ${controller_status}."
              failed=true
            }
            [[ "$model_status" == "200" ]] || {
              echo "contact-entitlement-model.js returned HTTP ${model_status}."
              failed=true
            }

            if [[ "$failed" == "false" ]]; then
              check_marker "$shell_file" 'createConversationInboxController' 'inbox-controller delegation marker' || failed=true
              check_marker "$shell_file" 'conversation-inbox-controller.js' 'inbox-controller import marker' || failed=true
              check_marker "$shell_file" 'contact-entitlement-model.js' 'error-model import marker' || failed=true
              check_marker "$controller_file" 'claim_private_proof_entitlement' 'entitlement RPC marker' || failed=true
              check_marker "$controller_file" 'contact entitlement activation' 'entitlement unwrap marker' || failed=true
              check_marker "$controller_file" 'open_match_conversation' 'conversation opening marker' || failed=true
              check_marker "$controller_file" 'contactOpenErrorMessage(error, getLanguage())' 'product error mapping marker' || failed=true
              check_marker "$model_file" 'Het eenmalige test-contactrecht is al gebruikt of niet meer geldig.' 'Dutch participant copy' || failed=true
              check_marker "$model_file" 'The one-time test contact right has already been used or is no longer valid.' 'English participant copy' || failed=true
            fi

            if [[ "$failed" == "false" ]]; then
              verified=true
              echo "Canonical entitlement client verified on attempt ${attempt}."
              break
            fi

            echo "Canonical assets have not converged yet (attempt ${attempt}/24); retrying."
            sleep 5
          done

          if [[ "$verified" != "true" ]]; then
            echo '::error title=Canonical entitlement client incomplete::The commit-matched deployment did not serve all required WP-072 client markers within the bounded retry window.'
            echo '--- product-shell.js head ---'
            sed -n '1,25p' "$shell_file" || true
            echo '--- conversation-inbox-controller.js head ---'
            sed -n '1,60p' "$controller_file" || true
            echo '--- contact-entitlement-model.js head ---'
            sed -n '1,40p' "$model_file" || true
            exit 1
          fi
