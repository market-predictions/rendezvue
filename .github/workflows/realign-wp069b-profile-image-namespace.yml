name: Align WP069B profile image namespace

on:
  push:
    branches:
      - feature/wp070-profile-image-preparation

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/wp070-profile-image-preparation
          fetch-depth: 0

      - name: Rename permanent non-workflow validation artifacts
        shell: bash
        run: |
          set -euo pipefail
          git mv scripts/validate-wp070-profile-image-preparation.mjs scripts/validate-wp069b-profile-image-preparation.mjs
          git mv scripts/verify-wp070-profile-image-staging.sh scripts/verify-wp069b-profile-image-staging.sh

          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('apps/private-preview/profile-image-preparation.js'),
              Path('package.json'),
              Path('scripts/validate-wp069b-profile-image-preparation.mjs'),
              Path('scripts/verify-wp069b-profile-image-staging.sh'),
              Path('supabase/migrations/20260805084500_profile_image_preparation.sql'),
              Path('supabase/migrations/20260805084600_profile_image_snapshot_redaction.sql'),
              Path('supabase/tests/database/014_profile_image_preparation.test.sql')
          ]
          for path in paths:
              source = path.read_text()
              source = source.replace('WP-070', 'WP-069B')
              source = source.replace('wp070', 'wp069b')
              path.write_text(source)
          PY

      - name: Verify namespace alignment
        run: |
          set -euo pipefail
          test -f scripts/validate-wp069b-profile-image-preparation.mjs
          test -f scripts/verify-wp069b-profile-image-staging.sh
          ! test -e scripts/validate-wp070-profile-image-preparation.mjs
          ! test -e scripts/verify-wp070-profile-image-staging.sh
          grep -Fq 'wp069b-profile-image-preparation' apps/private-preview/profile-image-preparation.js
          grep -Fq 'validate-wp069b-profile-image-preparation.mjs' package.json
          ! grep -R --line-number --exclude='realign-wp069b-profile-image-namespace.yml' -E 'WP-070|wp070' \
            apps/private-preview/profile-image-preparation.js \
            scripts/validate-wp069b-profile-image-preparation.mjs \
            scripts/verify-wp069b-profile-image-staging.sh \
            supabase/migrations/20260805084500_profile_image_preparation.sql \
            supabase/migrations/20260805084600_profile_image_snapshot_redaction.sql \
            supabase/tests/database/014_profile_image_preparation.test.sql \
            package.json
          node --check scripts/validate-wp069b-profile-image-preparation.mjs
          bash -n scripts/verify-wp069b-profile-image-staging.sh

      - name: Commit aligned namespace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/private-preview/profile-image-preparation.js \
            package.json \
            scripts/validate-wp069b-profile-image-preparation.mjs \
            scripts/verify-wp069b-profile-image-staging.sh \
            supabase/migrations/20260805084500_profile_image_preparation.sql \
            supabase/migrations/20260805084600_profile_image_snapshot_redaction.sql \
            supabase/tests/database/014_profile_image_preparation.test.sql
          git add -u scripts
          git commit -m 'chore(images): align participant preparation as WP-069B'
          git push origin HEAD:feature/wp070-profile-image-preparation
