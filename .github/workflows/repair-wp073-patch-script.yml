name: Repair WP073 patch marker

on:
  push:
    branches:
      - ux/wp073-conversation-inbox
    paths:
      - '.github/workflows/repair-wp073-patch-script.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preserve one bindEvents marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-wp073-conversation-inbox.py')
          source = path.read_text(encoding='utf-8')
          before = "replace_between(shell, 'function otherParticipant(match) {', 'function bindEvents() {', 'function bindEvents() {')"
          after = "replace_between(shell, 'function otherParticipant(match) {', 'function bindEvents() {', '')"
          if source.count(before) != 1:
              raise RuntimeError('expected duplicate-marker patch instruction exactly once')
          path.write_text(source.replace(before, after, 1), encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/patch-wp073-conversation-inbox.py
          git commit -m 'Fix WP-073 patch range marker'
          git push origin "HEAD:${GITHUB_REF_NAME}"
