name: Apply WP074 closeout documentation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-wp074-closeout.yml'
      - 'scripts/patch-wp074-closeout.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply closeout records once
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if grep --fixed-strings --quiet 'Mandatory privacy portrait filters restored and protected-acceptance verified' CHANGELOG.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'WP-074 closeout records already applied.'
          else
            python scripts/patch-wp074-closeout.py
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit closeout records
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/ROADMAP.md docs/WORKPACKAGES.md docs/WORK-CLAIMS.md docs/HANDOVER.md docs/PRIVACY-AND-SAFETY.md docs/decisions/ADR-0006-browser-privacy-filter-grid.md docs/WP-074-PRIVACY-PORTRAIT-FILTERS.md
          git diff --cached --check
          git commit -m 'Document WP-074 protected acceptance'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
