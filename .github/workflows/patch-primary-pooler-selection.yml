name: Harden PRIMARY pooler selection

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-primary-pooler-selection.yml'
      - 'scripts/patch-primary-pooler-selection.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply fail-closed PRIMARY selection
        run: python scripts/patch-primary-pooler-selection.py
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/configure-cloudflare-staging.yml
          git commit -m 'Fail closed on non-primary staging poolers'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
