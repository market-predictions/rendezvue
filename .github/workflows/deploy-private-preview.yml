name: Deploy private Supabase preview

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending repository migrations to the linked private project
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: rendezvue-private-supabase-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy private proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: rendezvue-private-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_PRIVATE_SPACE_ID: solidprivacy/rendezvue-private-preview
      RENDEZVUE_AUTH_REDIRECT_URL: https://solidprivacy-rendezvue-private-preview.static.hf.space/

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Validate protected environment contract
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_PROJECT_REF
            SUPABASE_DB_PASSWORD
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            HF_TOKEN
            HF_PRIVATE_SPACE_ID
            RENDEZVUE_AUTH_REDIRECT_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing protected configuration::$name is not configured"
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing protected configuration values: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]]; then
            echo "::error title=Invalid project reference::SUPABASE_PROJECT_REF has an unexpected format"
            exit 1
          fi
          if [[ "$SUPABASE_PUBLISHABLE_KEY" == sb_secret_* || "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error title=Unsafe browser key::Use an sb_publishable_ key, never an sb_secret_ key"
            exit 1
          fi
          node --input-type=module <<'NODE'
          const projectRef = process.env.SUPABASE_PROJECT_REF;
          const projectUrl = new URL(process.env.SUPABASE_URL);
          const redirect = new URL(process.env.RENDEZVUE_AUTH_REDIRECT_URL);
          if (projectUrl.protocol !== 'https:' || projectUrl.hostname !== `${projectRef}.supabase.co`) {
            throw new Error('SUPABASE_URL does not match SUPABASE_PROJECT_REF');
          }
          if (redirect.protocol !== 'https:' || redirect.hostname !== 'solidprivacy-rendezvue-private-preview.static.hf.space') {
            throw new Error('Private preview redirect must be the dedicated Hugging Face HTTPS URL');
          }
          console.log(`Protected configuration validated for ${projectUrl.hostname}.`);
          NODE

      - run: npm ci

      - name: Link repository migrations to private project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration state before deployment
        run: supabase migration list --linked

      - name: Apply pending migrations
        if: ${{ inputs.apply_migrations }}
        run: supabase db push

      - name: Show migration state after deployment
        run: supabase migration list --linked

      - name: Deploy authenticated account cleanup function
        run: supabase functions deploy delete-private-proof-account --project-ref "$SUPABASE_PROJECT_REF"

      - name: Configure Supabase Auth for private Hugging Face callback
        shell: bash
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/supabase-auth-config.json"
          payload="$RUNNER_TEMP/supabase-auth-update.json"
          status="$(curl --silent --show-error --output "$current" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"
          if [[ "$status" != "200" ]]; then
            echo "::error title=Auth config read failed::Management API returned HTTP $status"
            cat "$current"
            exit 1
          fi
          node --input-type=module - "$current" "$payload" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const current = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const redirect = process.env.RENDEZVUE_AUTH_REDIRECT_URL;
          const allow = String(current.uri_allow_list ?? '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          if (!allow.includes(redirect)) allow.push(redirect);
          writeFileSync(process.argv[3], JSON.stringify({
            site_url: redirect,
            uri_allow_list: allow.join(',')
          }));
          NODE
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/supabase-auth-update-response.json" --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'content-type: application/json' \
            --data-binary "@$payload" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"
          if [[ "$status" != "200" ]]; then
            echo "::error title=Auth config update failed::Management API returned HTTP $status"
            cat "$RUNNER_TEMP/supabase-auth-update-response.json"
            exit 1
          fi
          echo 'Supabase Auth callback configured for the private Hugging Face Space.'

      - name: Check remote Auth and Data API health
        shell: bash
        run: |
          set -euo pipefail
          auth_status="$(curl --silent --show-error --output "$RUNNER_TEMP/supabase-auth-health.json" --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/health")"
          [[ "$auth_status" == "200" ]] || { echo "::error title=Remote Auth health failed::HTTP $auth_status"; exit 1; }
          openapi_status="$(curl --silent --show-error --output "$RUNNER_TEMP/supabase-openapi.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/openapi?schema=public")"
          [[ "$openapi_status" == "200" ]] || { echo "::error title=Remote Data API metadata failed::HTTP $openapi_status"; exit 1; }
          echo 'Remote Auth and Data API metadata passed.'

      - name: Verify account cleanup function rejects unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          cleanup_status="$(curl --silent --show-error --output "$RUNNER_TEMP/account-cleanup-auth-gate.json" --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'content-type: application/json' \
            --data '{"confirmation":"DELETE_SYNTHETIC_ACCOUNT"}' \
            "$SUPABASE_URL/functions/v1/delete-private-proof-account")"
          [[ "$cleanup_status" == "401" ]] || { echo "::error title=Account cleanup auth gate failed::Expected 401, received $cleanup_status"; exit 1; }

      - name: Build and validate private browser proof
        run: |
          npm run build:private-preview
          npm run validate:private-preview

      - name: Install Hugging Face deployment client
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=0.32,<2"

      - name: Create or confirm private Static Space
        run: python scripts/huggingface_private_space.py ensure

      - name: Assemble private Static Space artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hf-private-deploy
          mkdir .hf-private-deploy
          cp -R dist-private-preview/. .hf-private-deploy/
          cat > .hf-private-deploy/README.md <<'EOF'
          ---
          title: Rendezvue Private Preview
          emoji: 🔒
          colorFrom: green
          colorTo: gray
          sdk: static
          app_file: index.html
          fullWidth: true
          header: mini
          ---

          Controlled synthetic-only Rendezvue proof. GitHub is the source of truth.
          EOF

      - name: Upload private proof to Hugging Face
        run: |
          hf upload "$HF_PRIVATE_SPACE_ID" .hf-private-deploy . \
            --repo-type=space \
            --delete="*" \
            --commit-message="Deploy private Rendezvue proof ${GITHUB_SHA}" \
            --token "$HF_TOKEN"

      - name: Verify private Hugging Face repository artifact
        run: python scripts/huggingface_private_space.py verify

      - name: Write run summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Rendezvue private Supabase proof

          - Project migrations linked: yes
          - Pending migrations applied: ${{ inputs.apply_migrations }}
          - Remote Auth and Data API: passed
          - Auth callback: private Hugging Face HTTPS URL
          - Authenticated account cleanup deployed: yes
          - Browser/server secret boundary: validated
          - Private Hugging Face Static Space deployed: yes
          - Private visibility verified: yes
          - Public Hugging Face pilot changed: no
          - Local runtime required: no
          - Real-user admission authorized: no

          Open the private Space while signed into the authorized Hugging Face account:
          https://huggingface.co/spaces/$HF_PRIVATE_SPACE_ID
          EOF
