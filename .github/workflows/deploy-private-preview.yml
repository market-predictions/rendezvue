name: Deploy private Supabase preview

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending repository migrations to the linked private project
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: rendezvue-private-supabase-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and package private proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: rendezvue-private-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      RENDEZVUE_AUTH_REDIRECT_URL: ${{ vars.RENDEZVUE_AUTH_REDIRECT_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Validate protected environment contract
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_PROJECT_REF
            SUPABASE_DB_PASSWORD
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            RENDEZVUE_AUTH_REDIRECT_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing protected configuration::$name is not configured in environment rendezvue-private-preview"
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing protected configuration values: %s\n' "${missing[*]}"
            echo 'Add them under Settings > Environments > rendezvue-private-preview before rerunning this workflow.'
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]]; then
            echo "::error title=Invalid project reference::SUPABASE_PROJECT_REF has an unexpected format"
            exit 1
          fi
          if [[ "$SUPABASE_PUBLISHABLE_KEY" == sb_secret_* ]]; then
            echo "::error title=Unsafe browser key::A Supabase secret key may never be used as SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          if [[ "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error title=Legacy or malformed key::Use a new sb_publishable_ key for the browser proof"
            exit 1
          fi
          node --input-type=module <<'NODE'
          const projectRef = process.env.SUPABASE_PROJECT_REF;
          const projectUrl = new URL(process.env.SUPABASE_URL);
          const redirect = new URL(process.env.RENDEZVUE_AUTH_REDIRECT_URL);
          if (projectUrl.protocol !== 'https:' || !projectUrl.hostname.endsWith('.supabase.co')) {
            throw new Error('SUPABASE_URL must be the HTTPS project URL');
          }
          if (!projectUrl.hostname.startsWith(`${projectRef}.`)) {
            throw new Error('SUPABASE_URL hostname does not match SUPABASE_PROJECT_REF');
          }
          if (!['http:', 'https:'].includes(redirect.protocol)) {
            throw new Error('RENDEZVUE_AUTH_REDIRECT_URL must use HTTP(S)');
          }
          console.log(`Protected configuration validated for ${projectUrl.hostname}.`);
          NODE

      - run: npm ci

      - name: Link repository migrations to private project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration state before deployment
        run: supabase migration list --linked

      - name: Apply pending migrations
        if: ${{ inputs.apply_migrations }}
        run: supabase db push

      - name: Show migration state after deployment
        run: supabase migration list --linked

      - name: Check remote Auth and Data API health
        shell: bash
        run: |
          set -euo pipefail

          auth_body="$RUNNER_TEMP/supabase-auth-health.json"
          auth_status="$(curl --silent --show-error \
            --output "$auth_body" \
            --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/auth/v1/health")"
          if [[ "$auth_status" != "200" ]]; then
            echo "::error title=Remote Auth health failed::Auth health returned HTTP $auth_status. Verify that SUPABASE_PUBLISHABLE_KEY belongs to SUPABASE_PROJECT_REF."
            cat "$auth_body"
            exit 1
          fi
          echo "Remote Auth health passed."

          openapi_body="$RUNNER_TEMP/supabase-openapi.json"
          openapi_status="$(curl --silent --show-error \
            --output "$openapi_body" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/openapi?schema=public")"
          if [[ "$openapi_status" != "200" ]]; then
            echo "::error title=Remote Data API metadata failed::Management API OpenAPI retrieval returned HTTP $openapi_status. Verify that SUPABASE_ACCESS_TOKEN can read this project."
            cat "$openapi_body"
            exit 1
          fi
          node --input-type=module - "$openapi_body" <<'NODE'
          import { readFileSync } from 'node:fs';
          const document = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (!document || typeof document !== 'object') {
            throw new Error('Data API OpenAPI response is not a JSON object');
          }
          console.log(`Remote Data API metadata passed (${Object.keys(document.paths ?? {}).length} paths).`);
          NODE

      - name: Build synthetic-only private proof artifact
        run: npm run build:private-preview

      - name: Validate browser/server secret boundary
        run: npm run validate:private-preview

      - uses: actions/upload-artifact@v4
        with:
          name: rendezvue-private-preview-${{ github.sha }}
          path: dist-private-preview/
          if-no-files-found: error
          retention-days: 3

      - name: Write run summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Rendezvue private Supabase proof

          - Project migrations linked: yes
          - Pending migrations applied: ${{ inputs.apply_migrations }}
          - Remote Auth health: passed
          - Remote Data API metadata: passed
          - Browser artifact contains only the publishable key: validated
          - Public Hugging Face pilot changed: no
          - Real-user admission authorized: no

          Download the short-lived workflow artifact and serve it locally with:

          \`python3 -m http.server 4174 --directory dist-private-preview\`
          EOF
