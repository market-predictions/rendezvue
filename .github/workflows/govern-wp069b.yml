name: Record WP069B governance

on:
  push:
    branches:
      - docs/wp069b-governance

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/wp069b-governance
          fetch-depth: 0

      - name: Update work packages, roadmap, handover, claims and changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workpackages = Path('docs/WORKPACKAGES.md')
          source = workpackages.read_text()
          block = """## WP-069A — Realistic synthetic profile portrait fixtures

          **Status:** complete for controlled synthetic staging; accepted in issue #89  
          The ten childlike illustrated discovery fixtures were replaced with unique photorealistic AI-generated adult synthetic portraits while retaining the deterministic Yasmin/Bilal/Amina/Idris/Maryam/Samir/Noura/Youssef/Hafsa/Omar mapping. Genuine optimized WebP delivery, synthetic-only manifest, uniqueness, dimensions and canonical Cloudflare availability were verified in run `30960048211`. Implementation PR #88 merged as `14eeaf60018e0cd507d570854b91e4f8418f380f`; durable verifier PR #90 merged as `dd64d7d5eb202e03934f819694fa6060999f237e`.

          ## WP-069B — Participant profile image preparation

          **Status:** technical foundation complete and canonically verified; owner field review pending; issue #91  
          Arbitrary JPEG/PNG/WebP uploads now enter a user-controlled 4:5 framing flow with pan, zoom, reset, safe-area guidance, square avatar preview and quality warnings. Rendezvue privately stores a normalized metadata-free WebP source plus explicit 960×1200 card and 384×384 avatar derivatives linked by one preparation ID. Only the card can be selected; exact account-scoped paths, one selected card, idempotency, concurrency serialization, path redaction and cross-account isolation are enforced. PR #92 merged as `a06f2ae7b7c4b5779e80143d62960856e63d9ac7`; protected run `30994962258` and canonical run `30995029165` passed. Detailed evidence: `docs/WP-069B-PROFILE-IMAGE-PREPARATION.md`.

          """
          marker = '## WP-070 — Trust and safety operations\n'
          if '## WP-069B — Participant profile image preparation' not in source:
              if marker not in source:
                  raise SystemExit('WP-070 insertion marker not found')
              source = source.replace(marker, block + marker, 1)
          workpackages.write_text(source)

          roadmap = Path('docs/ROADMAP.md')
          source = roadmap.read_text()
          source = source.replace('**Version:** 2.9  \n**Updated:** 2026-08-04', '**Version:** 2.10  \n**Updated:** 2026-08-05', 1)
          addendum = """
          ## Phase 2M — Profile image quality and resilient participant preparation

          **Status:** WP-069A complete; WP-069B technical foundation complete and canonically verified; owner field review pending.

          WP-069A replaced the childlike synthetic discovery fixtures with ten unique, realistic adult synthetic portraits and added durable canonical delivery verification.

          WP-069B addresses the production condition that participants will upload inconsistent source material. The normal portrait flow now provides user-controlled 4:5 framing, pan, zoom, reset, safe-area guidance, a square avatar preview and warnings for low-resolution, landscape and unusually narrow images. Source files are orientation-normalized where supported and browser-re-encoded to a private metadata-free WebP source. Explicit 960×1200 card and 384×384 avatar derivatives are generated and registered under one preparation ID.

          The database permits only the card role to become the selected profile portrait, enforces one selected card per account, serializes replacement, validates exact private paths and redacts Storage coordinates from onboarding snapshots and audit evidence. Resilient rendering uses the complete prepared image over a blurred background instead of cropping through face, forehead or chin merely to fill the card.

          Accepted technical evidence:

          - WP-069A issue #89, PRs #88/#90 and canonical run `30960048211`;
          - WP-069B issue #91 and PR #92 merged as `a06f2ae7b7c4b5779e80143d62960856e63d9ac7`;
          - protected migration/configuration run `30994962258`;
          - correctly sequenced canonical browser and protected-schema run `30995029165`;
          - pure framing tests, 37 new pgTAP assertions, complete migration replay, existing database contracts, race tests, seed, lint, Cloudflare and Docker validation.

          The next acceptance action is an owner-led desktop/mobile field review using deliberately difficult controlled uploads: tight selfie, off-centre landscape, tall/narrow source, low-resolution source and well-composed 4:5 portrait. Automatic face recognition is not included or claimed. Real-user admission remains unauthorized.
          """
          if '## Phase 2M — Profile image quality and resilient participant preparation' not in source:
              source = source.rstrip() + '\n' + addendum.strip() + '\n'
          roadmap.write_text(source)

          handover = Path('docs/HANDOVER.md')
          source = handover.read_text()
          source = source.replace('**Updated:** 2026-08-04  \n**Milestone:** WP-067 integrated onboarding, discovery and conversation product shell accepted on canonical staging', '**Updated:** 2026-08-05  \n**Milestone:** WP-069B participant profile image preparation technical foundation accepted; owner field review pending', 1)
          section = """## Current WP-069 image-quality milestone

          WP-069A replaced the childlike synthetic portrait fixtures with realistic adult synthetic faces. PR #88 merged as `14eeaf60018e0cd507d570854b91e4f8418f380f`, verifier PR #90 merged as `dd64d7d5eb202e03934f819694fa6060999f237e`, and canonical run `30960048211` verified all ten unique WebP assets and the synthetic-only manifest.

          WP-069B makes the participant upload flow resilient to arbitrary sources. PR #92 merged as `a06f2ae7b7c4b5779e80143d62960856e63d9ac7`. Protected run `30994962258` applied the schema to staging; canonical run `30995029165` passed the delivered framing editor, derivative contract and protected read-only schema verifier.

          The normal portrait flow now offers 4:5 pan/zoom framing, safe-area guidance, square avatar preview and quality warnings. It stores a private normalized source plus card/avatar derivatives, selects only the card derivative and renders uncertain aspect ratios with `contain` over a blurred same-image background rather than clipping the subject.

          Owner acceptance is still required. Test one controlled synthetic account with a tight selfie, off-centre landscape image, very tall image, low-resolution image and well-composed portrait on both desktop and mobile. Explicitly verify warning copy, drag/zoom/reset, chin/forehead visibility, immediate profile preview, discovery rendering, refresh behaviour and portrait replacement. Issue #91 remains open until this review is recorded.

          Detailed evidence: `docs/WP-069B-PROFILE-IMAGE-PREPARATION.md`.

          """
          marker = '## Architecture\n'
          if '## Current WP-069 image-quality milestone' not in source:
              if marker not in source:
                  raise SystemExit('handover architecture marker not found')
              source = source.replace(marker, section + marker, 1)
          handover.write_text(source)

          claims = Path('docs/WORK-CLAIMS.md')
          source = claims.read_text().rstrip()
          rows = """
          | WC-068 | The ten bundled synthetic discovery fixtures use unique photorealistic adult synthetic portraits rather than childlike illustrations. | Demonstrated in source and canonical delivery | issue #89, PRs #88/#90 and run `30960048211` | Synthetic staging fixtures only; they are not real or identity-verified users. |
          | WC-069 | An arbitrary participant image can be user-framed and registered as a private normalized source, 4:5 card derivative and square avatar while only the card can become the selected profile portrait. | Technical foundation demonstrated locally, in CI and remotely | issue #91, PR #92, 37 pgTAP assertions, protected run `30994962258` and canonical run `30995029165` | Owner field review with difficult uploads remains; no face detection, biometric identification, production-scale processing or real-user authorization is claimed. |
          """
          if '| WC-069 |' not in source:
              source += '\n' + rows.strip() + '\n'
          claims.write_text(source)

          changelog = Path('CHANGELOG.md')
          source = changelog.read_text()
          section = """### Participant profile image preparation foundation completed

          - Implemented WP-069B through issue #91 and PR #92, merged as `a06f2ae7b7c4b5779e80143d62960856e63d9ac7`.
          - Added a mobile-first 4:5 framing editor with pan, zoom, reset, safe-area guidance and square avatar preview.
          - Added warnings for low-resolution, landscape and unusually narrow sources without introducing biometric analysis.
          - Normalized orientation where supported and re-encoded the source to metadata-free private WebP rather than using the original upload directly.
          - Added explicit 960×1200 card and 384×384 avatar derivatives linked to one preparation ID.
          - Restricted selected portraits to the card role and enforced one selected card per account, exact private paths, idempotency and serialized replacement.
          - Redacted source and selected Storage paths from onboarding snapshots and kept object paths out of audit payloads and browser events.
          - Added resilient `contain` plus blurred same-image rendering so the app does not crop through face, chin or forehead merely to fill a slot.
          - Added pure framing tests, 37 pgTAP assertions, generated-artifact checks and a protected read-only staging verifier.
          - Protected run `30994962258` applied the migrations to the existing synthetic Supabase project.
          - Canonical run `30995029165` passed delivered browser behavior and the protected schema/RPC contract for merge `a06f2ae7b7c4b5779e80143d62960856e63d9ac7`.
          - Owner field review with difficult controlled uploads remains pending; real-user admission remains unauthorized.

          ### Realistic synthetic discovery portraits completed

          - Completed WP-069A through issue #89 and PR #88, merged as `14eeaf60018e0cd507d570854b91e4f8418f380f`.
          - Replaced the ten childlike illustrated fixtures with unique photorealistic AI-generated adult synthetic portraits.
          - Retained deterministic profile-name mapping and the synthetic-only manifest.
          - Converted mislabeled PNG uploads to genuine optimized WebP assets before merge.
          - Added durable portrait-only canonical verification through PR #90, merged as `dd64d7d5eb202e03934f819694fa6060999f237e`.
          - Canonical run `30960048211` verified all ten images, dimensions, uniqueness, content types, bounded sizes and synthetic-only status.
          - No real-user photographs or biometric reference images were introduced.

          """
          marker = '## [Unreleased]\n\n'
          if '### Participant profile image preparation foundation completed' not in source:
              if marker not in source:
                  raise SystemExit('changelog Unreleased marker not found')
              source = source.replace(marker, marker + section, 1)
          changelog.write_text(source)
          PY

      - name: Verify governance markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '## WP-069A — Realistic synthetic profile portrait fixtures' docs/WORKPACKAGES.md
          grep -Fq '## WP-069B — Participant profile image preparation' docs/WORKPACKAGES.md
          grep -Fq '**Version:** 2.10' docs/ROADMAP.md
          grep -Fq '## Phase 2M — Profile image quality and resilient participant preparation' docs/ROADMAP.md
          grep -Fq '## Current WP-069 image-quality milestone' docs/HANDOVER.md
          grep -Fq '| WC-069 |' docs/WORK-CLAIMS.md
          grep -Fq '### Participant profile image preparation foundation completed' CHANGELOG.md
          test -f docs/WP-069B-PROFILE-IMAGE-PREPARATION.md

      - name: Commit governance records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WORKPACKAGES.md docs/ROADMAP.md docs/HANDOVER.md docs/WORK-CLAIMS.md CHANGELOG.md docs/WP-069B-PROFILE-IMAGE-PREPARATION.md
          if git diff --cached --quiet; then
            echo 'Governance records already current.'
            exit 0
          fi
          git commit -m 'docs(images): record WP-069A and WP-069B milestones'
          git push origin HEAD:docs/wp069b-governance
