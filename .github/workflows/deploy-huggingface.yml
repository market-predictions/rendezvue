name: Deploy pilot to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      space_id:
        description: Optional owner/space-name override
        required: false
        type: string
      verify_timeout:
        description: Maximum seconds to wait for the static page
        required: false
        default: "600"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: huggingface-pilot
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.target.outputs.configured }}
      space_id: ${{ steps.target.outputs.space_id }}
      timeout: ${{ steps.target.outputs.timeout }}
    steps:
      - name: Resolve deployment configuration
        id: target
        env:
          INPUT_SPACE_ID: ${{ inputs.space_id }}
          REPOSITORY_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INPUT_TIMEOUT: ${{ inputs.verify_timeout }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          SPACE_ID="${INPUT_SPACE_ID:-$REPOSITORY_SPACE_ID}"
          TIMEOUT="${INPUT_TIMEOUT:-600}"
          if [[ -n "$SPACE_ID" && -n "$HF_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "space_id=$SPACE_ID" >> "$GITHUB_OUTPUT"
            echo "timeout=$TIMEOUT" >> "$GITHUB_OUTPUT"
            echo "Hugging Face deployment is configured for $SPACE_ID."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "space_id=$SPACE_ID" >> "$GITHUB_OUTPUT"
            echo "timeout=$TIMEOUT" >> "$GITHUB_OUTPUT"
            echo "::notice::Set repository variable HF_SPACE_ID and secret HF_TOKEN to activate the hosted pilot."
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "A manually requested deployment must have both values configured." >&2
              exit 1
            fi
          fi

  deploy:
    needs: configuration
    if: ${{ needs.configuration.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    environment: huggingface-pilot
    env:
      HF_SPACE_ID: ${{ needs.configuration.outputs.space_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Build and validate prebuilt static artifact
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Install Hugging Face deployment client
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "huggingface_hub>=0.32,<2"

      - name: Create or confirm free Static Space
        run: python scripts/huggingface_space.py ensure

      - name: Upload prebuilt static application
        run: |
          hf upload "$HF_SPACE_ID" .hf-deploy . \
            --repo-type=space \
            --delete="*" \
            --commit-message="Deploy Rendezvue ${GITHUB_SHA}" \
            --token "$HF_TOKEN"

      - name: Wait for static page and verify deployment marker
        id: verify
        run: python scripts/huggingface_space.py verify --timeout "${{ needs.configuration.outputs.timeout }}"

      - name: Publish deployment summary
        env:
          SPACE_URL: ${{ steps.verify.outputs.space_url }}
        run: |
          {
            echo "## Rendezvue Hugging Face pilot"
            echo
            echo "Prebuilt Static Space deployment and public-page verification succeeded."
            echo
            echo "**Pilot URL:** $SPACE_URL"
            echo
            echo "Open the direct Static Space URL for camera and PWA testing."
            echo
            echo "GitHub remains the source of truth; future pushes to main redeploy automatically."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful deployment in issue 2
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SPACE_URL: ${{ steps.verify.outputs.space_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh issue comment 2 --body-file - <<EOF
          ✅ Hosted deployment verified

          - Pilot URL: $SPACE_URL
          - Commit: \`$COMMIT_SHA\`
          - Workflow run: $RUN_URL

          GitHub built the complete static artifact and uploaded it directly. The served page returned the Rendezvue deployment marker. Mobile camera and PWA field testing remain before WP-015 is closed.
          EOF

      - name: Record failed deployment in issue 2
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh issue comment 2 --body-file - <<EOF
          ❌ Hosted deployment failed

          - Commit: \`$COMMIT_SHA\`
          - Workflow run: $RUN_URL

          Open the failed step in the linked run. Do not rotate the Hugging Face token unless the log reports an authentication or authorization error.
          EOF
