name: Configure Cloudflare staging backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-cloudflare-staging.yml'
      - '.github/workflows/verify-wp072-contact-entitlement.yml'
      - '.github/workflows/verify-wp074-privacy-portrait-filters.yml'
      - 'apps/private-preview/**'
      - 'apps/web/src/auth-session.js'
      - 'apps/web/src/backend-contract.js'
      - 'apps/web/src/onboarding-repository.js'
      - 'scripts/build-private-preview.mjs'
      - 'scripts/validate-private-preview.mjs'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending repository migrations to the protected staging database
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: rendezvue-cloudflare-staging-backend
  cancel-in-progress: false

jobs:
  configure:
    name: Configure Supabase and validate Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: rendezvue-private-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      RENDEZVUE_STAGING_URL: https://rendezvue-private-preview.pages.dev/

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Validate protected configuration contract
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_PROJECT_REF
            SUPABASE_DB_PASSWORD
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            RENDEZVUE_STAGING_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing protected configuration::$name is not configured"
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing protected configuration values: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]]; then
            echo '::error title=Invalid project reference::SUPABASE_PROJECT_REF has an unexpected format'
            exit 1
          fi
          if [[ "$SUPABASE_PUBLISHABLE_KEY" == sb_secret_* || "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo '::error title=Unsafe browser key::Use an sb_publishable_ key, never an sb_secret_ key'
            exit 1
          fi
          node --input-type=module <<'NODE'
          const projectRef = process.env.SUPABASE_PROJECT_REF;
          const projectUrl = new URL(process.env.SUPABASE_URL);
          const staging = new URL(process.env.RENDEZVUE_STAGING_URL);
          if (projectUrl.protocol !== 'https:' || projectUrl.hostname !== `${projectRef}.supabase.co`) {
            throw new Error('SUPABASE_URL does not match SUPABASE_PROJECT_REF');
          }
          if (staging.href !== 'https://rendezvue-private-preview.pages.dev/') {
            throw new Error('Cloudflare staging URL differs from the canonical fixed URL');
          }
          NODE

      - run: npm ci

      - name: Resolve protected Supavisor session connection without Supabase link
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/supabase-pooler.json"
          db_url_file="$RUNNER_TEMP/supabase-db-url.txt"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")"
          if [[ "$status" != "200" ]]; then
            echo "::error title=Database connection discovery failed::Supabase Management API returned HTTP $status"
            exit 1
          fi

          node --input-type=module - "$response" "$db_url_file" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const configs = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(configs) || configs.length === 0) {
            throw new Error('Supabase pooler configuration is empty');
          }
          const primarySupavisor = configs.filter((entry) =>
            String(entry?.database_type ?? '').toUpperCase() === 'PRIMARY'
            && String(entry?.db_host ?? '').endsWith('.pooler.supabase.com')
          );
          if (!primarySupavisor.length) {
            throw new Error('No PRIMARY Supavisor pooler configuration was returned');
          }
          const selected = primarySupavisor.find((entry) => String(entry?.pool_mode ?? '').toLowerCase() === 'transaction')
            ?? primarySupavisor[0];
          const required = ['db_user', 'db_host', 'db_name'];
          for (const key of required) {
            if (!selected?.[key]) throw new Error(`Supabase pooler configuration is missing ${key}`);
          }
          const url = new URL('postgresql://placeholder:placeholder@localhost/postgres');
          url.username = String(selected.db_user);
          url.password = process.env.SUPABASE_DB_PASSWORD;
          url.hostname = String(selected.db_host);
          // Supabase Shared Pooler uses the same Supavisor host on port 5432 for session mode.
          // The Management API may report the transaction-mode config (typically 6543), so
          // migrations deliberately derive the documented session endpoint instead of trusting db_port.
          url.port = '5432';
          url.pathname = `/${String(selected.db_name).replace(/^\/+/, '')}`;
          url.searchParams.set('sslmode', 'require');
          writeFileSync(process.argv[3], url.toString(), { mode: 0o600 });
          NODE

          db_url="$(cat "$db_url_file")"
          [[ "$db_url" == postgresql://* ]] || { echo '::error title=Invalid database URL::Resolved database URL has an unexpected scheme'; exit 1; }
          echo "::add-mask::$db_url"
          printf 'RENDEZVUE_DB_URL=%s\n' "$db_url" >> "$GITHUB_ENV"

      - name: Show migration state before deployment
        run: supabase migration list --db-url "$RENDEZVUE_DB_URL"

      - name: Apply pending migrations
        if: ${{ github.event_name == 'push' || inputs.apply_migrations }}
        run: supabase db push --db-url "$RENDEZVUE_DB_URL"

      - name: Show migration state after deployment
        run: supabase migration list --db-url "$RENDEZVUE_DB_URL"

      - name: Deploy authenticated account cleanup function
        run: supabase functions deploy delete-private-proof-account --project-ref "$SUPABASE_PROJECT_REF"

      - name: Configure Supabase Auth URL for Cloudflare staging
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/cloudflare-url-config.json"
          response="$RUNNER_TEMP/cloudflare-url-response.json"

          node --input-type=module - "$payload" <<'NODE'
          import { writeFileSync } from 'node:fs';
          const staging = process.env.RENDEZVUE_STAGING_URL;
          writeFileSync(process.argv[2], JSON.stringify({
            site_url: staging,
            uri_allow_list: staging
          }));
          NODE

          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'content-type: application/json' \
            --data-binary "@$payload" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"
          if [[ "$status" != "200" ]]; then
            echo "::error title=Cloudflare Auth URL configuration failed::Supabase Management API returned HTTP $status"
            node --input-type=module --eval "
              import { readFileSync } from 'node:fs';
              const raw = readFileSync(process.argv[1], 'utf8');
              try {
                const error = JSON.parse(raw);
                console.error(JSON.stringify({ message: error.message, error: error.error, code: error.code }));
              } catch {
                console.error(raw.slice(0, 1000));
              }
            " "$response"
            exit 1
          fi

      - name: Verify Supabase Auth staging configuration
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/cloudflare-auth-verification.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"
          [[ "$status" == "200" ]] || { echo "::error title=Auth configuration verification failed::HTTP $status"; exit 1; }

          node --input-type=module - "$response" <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = process.env.RENDEZVUE_STAGING_URL;
          const config = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (config.site_url !== expected) throw new Error('Supabase Site URL does not match Cloudflare staging');
          const allow = String(config.uri_allow_list ?? '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          if (allow.length !== 1 || allow[0] !== expected) {
            throw new Error('Supabase redirect allow-list is not restricted to the canonical Cloudflare URL');
          }
          NODE

      - name: Check remote Auth and Data API health
        shell: bash
        run: |
          set -euo pipefail
          auth_status="$(curl --silent --show-error --output "$RUNNER_TEMP/supabase-auth-health.json" --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/health")"
          [[ "$auth_status" == "200" ]] || { echo "::error title=Remote Auth health failed::HTTP $auth_status"; exit 1; }
          openapi_status="$(curl --silent --show-error --output "$RUNNER_TEMP/supabase-openapi.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/openapi?schema=public")"
          [[ "$openapi_status" == "200" ]] || { echo "::error title=Remote Data API metadata failed::HTTP $openapi_status"; exit 1; }

      - name: Verify account cleanup rejects unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          cleanup_status="$(curl --silent --show-error --output "$RUNNER_TEMP/account-cleanup-auth-gate.json" --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'content-type: application/json' \
            --data '{"confirmation":"DELETE_SYNTHETIC_ACCOUNT"}' \
            "$SUPABASE_URL/functions/v1/delete-private-proof-account")"
          [[ "$cleanup_status" == "401" ]] || { echo "::error title=Account cleanup auth gate failed::Expected 401, received $cleanup_status"; exit 1; }

      - name: Build and validate Cloudflare Pages artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run check:cloudflare

      - name: Write run summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Rendezvue Cloudflare staging backend

          - Canonical URL: $RENDEZVUE_STAGING_URL
          - Migration transport: protected Supavisor session URL on port 5432 (no supabase link dependency)
          - Pending migrations applied: ${{ github.event_name == 'push' || inputs.apply_migrations }}
          - Remote Auth and Data API: passed
          - Supabase Site URL and allow-list: Cloudflare Pages only
          - Passwordless delivery: default-provider PKCE magic link
          - Authenticated account cleanup deployed: yes
          - Browser/server secret boundary: validated
          - Hugging Face deployment performed: no
          - Real-user admission authorized: no
          EOF

      - name: Record successful backend configuration
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 35 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## Cloudflare staging backend configured

          - commit: \`${GITHUB_SHA}\`
          - workflow: $RUN_URL
          - migration transport: protected Supavisor session URL on port 5432; no \`supabase link\` dependency
          - Supabase Site URL and allow-list: \`$RENDEZVUE_STAGING_URL\`
          - passwordless flow: default-provider PKCE magic link
          - migrations, remote health, cleanup deployment and anonymous rejection: passed
          - browser artifact credential boundary: passed
          - real-user admission: not authorized
          EOF

      - name: Record backend configuration failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 35 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## Cloudflare staging backend configuration failed

          - commit: \`${GITHUB_SHA}\`
          - workflow: $RUN_URL
          - result: migration transport, Supabase URL configuration, health, cleanup deployment or browser artifact validation did not complete
          - action: inspect the protected run; no backend or Cloudflare staging success is claimed
          - real-user admission: not authorized
          EOF
