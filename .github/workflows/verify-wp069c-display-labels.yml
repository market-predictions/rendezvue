name: Verify WP069C customer-facing profile labels

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-wp069c-display-labels.yml'
      - 'apps/private-preview/product-model.js'
      - 'apps/private-preview/product-shell.js'
      - 'apps/web/tests/product-model.test.mjs'
      - 'scripts/build-private-preview.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_run:
    workflows: ['Configure Cloudflare staging backend']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rendezvue-wp069c-labels-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate WP-069C source and generated artifact
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build and validate display-label boundary
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test apps/web/tests/product-model.test.mjs
          npm run build:cloudflare

          require_marker() {
            local file="$1"
            local marker="$2"
            local label="$3"
            grep --fixed-strings --quiet "$marker" "$file" || {
              echo "::error title=WP-069C marker missing::${label} is missing ${marker}."
              exit 1
            }
          }

          require_marker apps/private-preview/product-model.js "serious_relationship: 'Serieuze relatie'" 'Dutch relationship label'
          require_marker apps/private-preview/product-model.js "serious_relationship: 'Serious relationship'" 'English relationship label'
          require_marker apps/private-preview/product-shell.js "profileDisplayValue(state.language, 'relationshipIntent'" 'relationship display boundary'
          require_marker apps/private-preview/product-shell.js "profileDisplayValue(state.language, 'lifeStage'" 'life-stage display boundary'
          require_marker dist-private-preview/product-model.js "serious_relationship: 'Serieuze relatie'" 'generated Dutch relationship label'
          require_marker dist-private-preview/product-model.js "serious_relationship: 'Serious relationship'" 'generated English relationship label'
          require_marker dist-private-preview/product-shell.js "profileDisplayValue(state.language, 'relationshipIntent'" 'generated relationship display boundary'

          for file in apps/private-preview/product-shell.js dist-private-preview/product-shell.js; do
            if grep --extended-regexp --quiet 'textContent[[:space:]]*=[[:space:]]*(preview|profile\.display)\.relationshipIntent' "$file"; then
              echo "::error title=Raw relationship enum rendering::${file} can render relationship_intent without the customer-facing mapper."
              exit 1
            fi
            if grep --extended-regexp --quiet 'textContent[[:space:]]*=[[:space:]]*\[[^]]*(preview|profile\.display)\.lifeStage' "$file"; then
              echo "::error title=Raw life-stage enum rendering::${file} can render primary_status without the customer-facing mapper."
              exit 1
            fi
          done

  verify:
    name: Verify canonical WP-069C labels
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      STAGING_URL: https://rendezvue-private-preview.pages.dev/
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Wait for commit-matched canonical deployment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo '::error title=Invalid commit::EXPECTED_SHA is not a full Git commit.'
            exit 1
          }

          metadata="$RUNNER_TEMP/deployment.json"
          matched=false
          for attempt in {1..72}; do
            status="$(curl --silent --show-error --location \
              --output "$metadata" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}deployment.json?commit=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            if [[ "$status" == "200" ]] && node --input-type=module --eval "
              import { readFileSync } from 'node:fs';
              const document = JSON.parse(readFileSync(process.argv[1], 'utf8'));
              if (document.buildCommit !== process.argv[2]) process.exit(1);
              if (document.hostingPlatform !== 'cloudflare-pages') process.exit(1);
              if (document.remoteBackendConfigured !== true) process.exit(1);
              if (document.realUserAdmissionAuthorized !== false) process.exit(1);
            " "$metadata" "$EXPECTED_SHA"; then
              matched=true
              break
            fi
            echo "Canonical deployment is not commit-matched yet (attempt $attempt, HTTP $status)."
            sleep 10
          done
          [[ "$matched" == "true" ]] || {
            echo '::error title=Deployment did not converge::WP-069C canonical deployment was not commit-matched within 12 minutes.'
            exit 1
          }

      - name: Verify delivered customer-facing labels
        shell: bash
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/product-model.js"
          shell="$RUNNER_TEMP/product-shell.js"

          for item in "product-model.js:$model" "product-shell.js:$shell"; do
            route="${item%%:*}"
            destination="${item#*:}"
            status="$(curl --silent --show-error --location \
              --output "$destination" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}${route}?commit=${EXPECTED_SHA}" || true)"
            [[ "$status" == "200" ]] || {
              echo "::error title=WP-069C artifact missing::${route} returned HTTP ${status}."
              exit 1
            }
          done

          grep --fixed-strings --quiet "serious_relationship: 'Serieuze relatie'" "$model"
          grep --fixed-strings --quiet "serious_relationship: 'Serious relationship'" "$model"
          grep --fixed-strings --quiet "recent_graduate: 'Recent afgestudeerd'" "$model"
          grep --fixed-strings --quiet "self_employed: 'Self-employed'" "$model"
          grep --fixed-strings --quiet "profileDisplayValue(state.language, 'relationshipIntent'" "$shell"
          grep --fixed-strings --quiet "profileDisplayValue(state.language, 'lifeStage'" "$shell"

          if grep --extended-regexp --quiet 'textContent[[:space:]]*=[[:space:]]*(preview|profile\.display)\.relationshipIntent' "$shell"; then
            echo '::error title=Raw relationship enum delivered::Canonical product shell bypasses the display mapper.'
            exit 1
          fi
          if grep --extended-regexp --quiet 'textContent[[:space:]]*=[[:space:]]*\[[^]]*(preview|profile\.display)\.lifeStage' "$shell"; then
            echo '::error title=Raw life-stage enum delivered::Canonical product shell bypasses the display mapper.'
            exit 1
          fi

      - name: Record successful WP-069C verification
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh issue comment 94 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## WP-069C canonical verification passed

          - commit: \`$EXPECTED_SHA\`
          - workflow: $RUN_URL
          - Dutch \`serious_relationship\` label: \`Serieuze relatie\`
          - English \`serious_relationship\` label: \`Serious relationship\`
          - life-stage labels: translated through the shared display boundary
          - direct raw enum rendering: absent
          - real-user admission: not authorized
          EOF

      - name: Record WP-069C verification failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh issue comment 94 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## WP-069C canonical verification failed

          - expected commit: \`$EXPECTED_SHA\`
          - workflow: $RUN_URL
          - result: commit matching, delivered labels or raw-enum rejection did not pass
          - real-user admission remains unauthorized
          EOF
