name: Verify WP-065D account support staging

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-account-support-staging.yml'
      - 'scripts/verify-wp065d-support-staging.sh'
      - 'supabase/migrations/20260803185000_account_support_recovery_cases.sql'
      - 'supabase/migrations/20260803185100_account_support_deletion_safe_references.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-account-support-staging.yml'
      - 'scripts/verify-wp065d-support-staging.sh'
      - 'supabase/migrations/20260803185000_account_support_recovery_cases.sql'
      - 'supabase/migrations/20260803185100_account_support_deletion_safe_references.sql'
  workflow_run:
    workflows: ['Configure Cloudflare staging backend']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rendezvue-wp065d-support-verifier-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate account-support verifier contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate shell syntax and non-destructive boundary
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/verify-wp065d-support-staging.sh'
          bash -n "$script"

          required=(
            'read_only: true'
            'case_count'
            'event_count'
            'service_role_can_insert_cases'
            'service_role_can_open_cases'
            'dangerous_function_count'
          )
          for marker in "${required[@]}"; do
            grep --fixed-strings --quiet "$marker" "$script" || {
              echo "::error title=Missing verifier marker::$marker"
              exit 1
            }
          done

          forbidden=(
            'delete[[:space:]]+from'
            'truncate[[:space:]]+'
            'drop[[:space:]]+table'
            'update[[:space:]]+auth\.users'
            'insert[[:space:]]+into[[:space:]]+auth\.users'
            'supabase[[:space:]]+db[[:space:]]+reset[[:space:]]+--linked'
          )
          for pattern in "${forbidden[@]}"; do
            if grep --extended-regexp --ignore-case --quiet "$pattern" "$script"; then
              echo "::error title=Unsafe verifier pattern::$pattern"
              exit 1
            fi
          done

  verify:
    name: Verify protected Supabase account-support state
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: rendezvue-private-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate protected verifier configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || {
            echo '::error title=Missing token::SUPABASE_ACCESS_TOKEN is not configured'
            exit 1
          }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]] || {
            echo '::error title=Invalid project reference::SUPABASE_PROJECT_REF has an unexpected format'
            exit 1
          }

      - name: Verify remote account-support schema and privileges
        shell: bash
        run: bash scripts/verify-wp065d-support-staging.sh

      - name: Write verification summary
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065D remote account-support verification' \
            '' \
            '- Support schema: present' \
            '- Support cases/events: 0 / 0' \
            '- Anonymous/authenticated access: denied' \
            '- Service-role direct table writes: denied' \
            '- Service-role controlled open/transition functions: allowed' \
            '- Merge, Auth restoration, e-mail change or support deletion functions: absent' \
            '- Real-user admission authorized: no' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful account-support verification
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065D remote account-support verification passed' \
            '' \
            "- commit: \`$GITHUB_SHA\`" \
            "- workflow: $RUN_URL" \
            '- support schema: present' \
            '- support cases/events: 0 / 0' \
            '- anonymous/authenticated access: denied' \
            '- service-role direct writes: denied' \
            '- service-role controlled open/transition functions: allowed' \
            '- account merge/Auth restoration/e-mail change/support deletion functions: absent' \
            '- real-user admission: not authorized' \
            | gh issue comment 62 --repo "$GITHUB_REPOSITORY" --body-file -

      - name: Record account-support verification failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065D remote account-support verification failed' \
            '' \
            "- commit: \`$GITHUB_SHA\`" \
            "- workflow: $RUN_URL" \
            '- result: support schema, empty-state, privilege or forbidden-mutation contract did not pass' \
            '- no account mutation is authorized' \
            '- real-user admission remains unauthorized' \
            | gh issue comment 62 --repo "$GITHUB_REPOSITORY" --body-file -
