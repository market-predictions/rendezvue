name: Validate Rendezvue

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendezvue-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and artifact checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  private_preview:
    name: Private preview and cleanup boundary
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
      RENDEZVUE_AUTH_REDIRECT_URL: http://127.0.0.1:4174/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run check:private-preview
      - run: deno check supabase/functions/delete-private-proof-account/index.ts

  database:
    name: Backend migration, pgTAP and race tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Remove any stale local stack
        run: supabase stop --no-backup || true
      - name: Start clean local database and apply migrations
        run: supabase db start
      - name: Replay migrations from an empty database
        run: supabase db reset
      - name: Run database contract tests
        run: supabase test db
      - name: Run parallel match and entitlement race tests
        run: bash supabase/tests/concurrency/run.sh
      - name: Lint local database schema
        run: supabase db lint --local --level warning
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  docker:
    name: Retained Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag rendezvue-validation .
