name: Validate Rendezvue

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendezvue-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and artifact checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Generate reproducible synthetic portraits
        run: |
          python -m pip install 'Pillow==11.3.0'
          python scripts/generate-synthetic-portraits.py
      - run: npm run check
      - run: python -m py_compile scripts/generate-synthetic-portraits.py

  cloudflare_staging:
    name: Cloudflare Pages staging and cleanup boundary
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run check:cloudflare
      - run: deno check --node-modules-dir=auto supabase/functions/delete-private-proof-account/index.ts

  database:
    name: Backend migration, pgTAP, function and race tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Remove any stale local stack
        run: supabase stop --no-backup || true
      - name: Start clean local Supabase stack and apply migrations
        run: supabase start
      - name: Smoke-test cleanup Edge Function auth gate
        shell: bash
        run: |
          set -euo pipefail
          endpoint="http://127.0.0.1:54321/functions/v1/delete-private-proof-account"
          options_status=""
          options_headers="$RUNNER_TEMP/cleanup-options-headers.txt"

          for _ in {1..45}; do
            options_status="$(curl --silent \
              --dump-header "$options_headers" \
              --output /dev/null \
              --write-out '%{http_code}' \
              --request OPTIONS \
              --header 'origin: https://rendezvue-private-preview.pages.dev' \
              --header 'access-control-request-method: POST' \
              "$endpoint" || true)"
            [[ "$options_status" == "200" || "$options_status" == "204" ]] && break
            sleep 1
          done

          if [[ "$options_status" != "200" && "$options_status" != "204" ]]; then
            supabase status || true
            docker ps --format 'table {{.Names}}\t{{.Status}}' || true
            echo "Expected cleanup function CORS preflight HTTP 200 or 204, received $options_status"
            exit 1
          fi
          if ! grep -Eiq '^access-control-allow-origin:[[:space:]]*\*' "$options_headers"; then
            cat "$options_headers"
            echo 'Cleanup function CORS preflight omitted Access-Control-Allow-Origin: *'
            exit 1
          fi

          post_status="$(curl --silent --output "$RUNNER_TEMP/cleanup-unauth.json" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"confirmation":"DELETE_SYNTHETIC_ACCOUNT"}' \
            "$endpoint")"
          if [[ "$post_status" != "401" ]]; then
            supabase status || true
            cat "$RUNNER_TEMP/cleanup-unauth.json"
            echo "Expected unauthenticated cleanup HTTP 401, received $post_status"
            exit 1
          fi
          echo "Cleanup function runtime, CORS and user-auth gate passed."
      - name: Replay migrations from an empty database
        run: supabase db reset
      - name: Run database contract tests
        run: supabase test db
      - name: Run parallel match and entitlement race tests
        run: bash supabase/tests/concurrency/run.sh
      - name: Execute and verify deterministic synthetic SQL seed
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/synthetic-seed-sql.log"
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          if [[ -z "$db_container" ]]; then
            echo 'No running local Supabase database container found.' | tee "$log_file"
            exit 1
          fi
          docker exec "$db_container" rm -rf /tmp/synthetic-seed
          docker cp synthetic-seed "$db_container:/tmp/synthetic-seed"

          set +e
          docker exec -w /tmp "$db_container" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f synthetic-seed/seed.sql \
            >"$log_file" 2>&1
          seed_status=$?
          set -e
          cat "$log_file"
          if [[ "$seed_status" -ne 0 ]]; then
            echo "Synthetic SQL seed failed with exit status $seed_status" | tee -a "$log_file"
            exit "$seed_status"
          fi

          counts="$(docker exec "$db_container" psql -U postgres -d postgres -Atc \
            "select concat_ws('|',
              (select count(*) from public.profiles where is_synthetic),
              (select count(*) from public.profiles where is_synthetic and publication_status='published'),
              (select count(*) from public.profile_interests pi join public.profiles p on p.user_id=pi.user_id where p.is_synthetic),
              (select count(*) from public.profile_prompts pp join public.profiles p on p.user_id=pp.user_id where p.is_synthetic),
              (select count(*) from public.privacy_portraits pp join public.profiles p on p.user_id=pp.user_id where p.is_synthetic and pp.is_public_profile_portrait)
            );")"
          echo "Synthetic seed counts: $counts" | tee -a "$log_file"
          if [[ "$counts" != '10|10|50|20|10' ]]; then
            echo "Unexpected synthetic seed counts: $counts" | tee -a "$log_file"
            exit 1
          fi
          echo "Synthetic seed counts verified: $counts" | tee -a "$log_file"
      - name: Upload synthetic seed diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-seed-diagnostics
          path: ${{ runner.temp }}/synthetic-seed-sql.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Lint local database schema
        run: supabase db lint --local --level warning
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  docker:
    name: Retained Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag rendezvue-validation .
