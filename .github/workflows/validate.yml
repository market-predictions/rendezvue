name: Validate Rendezvue

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendezvue-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and artifact checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  private_preview:
    name: Private preview and cleanup boundary
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
      RENDEZVUE_AUTH_REDIRECT_URL: http://127.0.0.1:4174/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run check:private-preview
      - run: deno check --node-modules-dir=auto supabase/functions/delete-private-proof-account/index.ts

  database:
    name: Backend migration, pgTAP, function and race tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Remove any stale local stack
        run: supabase stop --no-backup || true
      - name: Start clean local database and apply migrations
        run: supabase db start
      - name: Smoke-test cleanup Edge Function auth gate
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/delete-private-proof-account.log"
          supabase functions serve delete-private-proof-account --no-verify-jwt >"$log_file" 2>&1 &
          function_pid=$!
          cleanup() { kill "$function_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          options_status=""
          for _ in {1..30}; do
            options_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request OPTIONS \
              --header 'origin: http://127.0.0.1:4174' \
              --header 'access-control-request-method: POST' \
              http://127.0.0.1:54321/functions/v1/delete-private-proof-account || true)"
            [[ "$options_status" == "204" ]] && break
            sleep 1
          done
          if [[ "$options_status" != "204" ]]; then
            cat "$log_file"
            echo "Expected cleanup function CORS preflight HTTP 204, received $options_status"
            exit 1
          fi

          post_status="$(curl --silent --output "$RUNNER_TEMP/cleanup-unauth.json" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"confirmation":"DELETE_SYNTHETIC_ACCOUNT"}' \
            http://127.0.0.1:54321/functions/v1/delete-private-proof-account)"
          if [[ "$post_status" != "401" ]]; then
            cat "$log_file"
            cat "$RUNNER_TEMP/cleanup-unauth.json"
            echo "Expected unauthenticated cleanup HTTP 401, received $post_status"
            exit 1
          fi
          echo "Cleanup function runtime and user-auth gate passed."
      - name: Replay migrations from an empty database
        run: supabase db reset
      - name: Run database contract tests
        run: supabase test db
      - name: Run parallel match and entitlement race tests
        run: bash supabase/tests/concurrency/run.sh
      - name: Lint local database schema
        run: supabase db lint --local --level warning
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  docker:
    name: Retained Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag rendezvue-validation .
