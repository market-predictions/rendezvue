name: Record private preview deployment

on:
  workflow_run:
    workflows: ["Deploy private Supabase preview"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  record:
    name: Record non-secret deployment evidence
    runs-on: ubuntu-latest
    steps:
      - name: Record successful private deployment
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## Private Hugging Face deployment succeeded

          - workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          - commit: \`$HEAD_SHA\`
          - trigger: \`$RUN_EVENT\`
          - private Space: \`solidprivacy/rendezvue-private-preview\`
          - private visibility and deployed repository artifact: verified by the deployment workflow
          - Supabase Auth callback: dedicated Hugging Face HTTPS URL
          - public Hugging Face pilot changed: no
          - owner-local runtime required: no
          - real-user admission authorized: no

          This evidence intentionally contains no credentials, magic links, signed URLs or private object paths.
          EOF

      - name: Record failed private deployment
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## Private Hugging Face deployment did not complete

          - workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          - commit: \`$HEAD_SHA\`
          - trigger: \`$RUN_EVENT\`
          - conclusion: \`$CONCLUSION\`

          No private deployment success is claimed. Inspect the protected workflow job without copying credentials or private URLs into this issue.
          EOF
