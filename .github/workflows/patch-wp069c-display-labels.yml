name: Patch WP069C display labels

on:
  push:
    branches:
      - fix/wp069c-display-labels

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/wp069c-display-labels
          fetch-depth: 0

      - name: Patch model, renderer and tests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wp069c.py <<'PY'
          from pathlib import Path

          model = Path('apps/private-preview/product-model.js')
          source = model.read_text()
          marker = 'export function derivePartnerSex(sex) {'
          helper = """const PROFILE_DISPLAY_LABELS = Object.freeze({
  nl: Object.freeze({
    relationshipIntent: Object.freeze({
      serious_relationship: 'Serieuze relatie',
      serious_introduction: 'Serieuze kennismaking',
      marriage_intent: 'Kennismaking met huwelijk als doel'
    }),
    lifeStage: Object.freeze({
      student: 'Student',
      recent_graduate: 'Recent afgestudeerd',
      employed: 'Werkend',
      self_employed: 'Zelfstandig'
    })
  }),
  en: Object.freeze({
    relationshipIntent: Object.freeze({
      serious_relationship: 'Serious relationship',
      serious_introduction: 'Serious introduction',
      marriage_intent: 'Getting to know someone with marriage in mind'
    }),
    lifeStage: Object.freeze({
      student: 'Student',
      recent_graduate: 'Recent graduate',
      employed: 'Employed',
      self_employed: 'Self-employed'
    })
  })
});

export function profileDisplayValue(language, field, value) {
  const raw = String(value ?? '').trim();
  if (!raw) return '';
  const lang = normaliseProductLanguage(language);
  const mapped = PROFILE_DISPLAY_LABELS[lang]?.[field]?.[raw];
  if (mapped) return mapped;
  if (/^[a-z0-9]+(?:_[a-z0-9]+)+$/.test(raw)) {
    const humanised = raw.replaceAll('_', ' ');
    return humanised.charAt(0).toUpperCase() + humanised.slice(1);
  }
  return raw;
}

"""
          if 'export function profileDisplayValue' not in source:
              if marker not in source:
                  raise SystemExit('model marker missing')
              model.write_text(source.replace(marker, helper + marker, 1))

          shell = Path('apps/private-preview/product-shell.js')
          source = shell.read_text()
          replacements = [
              ("  profilePreview,\n  projectDiscoveryProfile,", "  profileDisplayValue,\n  profilePreview,\n  projectDiscoveryProfile,"),
              ("  meta.textContent = [preview.city, preview.lifeStage].filter(Boolean).join(' · ');", "  meta.textContent = [preview.city, profileDisplayValue(state.language, 'lifeStage', preview.lifeStage)].filter(Boolean).join(' · ');"),
              ("  intent.textContent = preview.relationshipIntent;", "  intent.textContent = profileDisplayValue(state.language, 'relationshipIntent', preview.relationshipIntent);"),
              ("    meta.textContent = [profile.display.city, profile.display.lifeStage].filter(Boolean).join(' · ');", "    meta.textContent = [profile.display.city, profileDisplayValue(state.language, 'lifeStage', profile.display.lifeStage)].filter(Boolean).join(' · ');"),
              ("    intent.textContent = profile.display.relationshipIntent;", "    intent.textContent = profileDisplayValue(state.language, 'relationshipIntent', profile.display.relationshipIntent);")
          ]
          for old, new in replacements:
              if old not in source and new not in source:
                  raise SystemExit(f'shell marker missing: {old}')
              source = source.replace(old, new, 1)
          shell.write_text(source)

          tests = Path('apps/web/tests/product-model.test.mjs')
          source = tests.read_text()
          old_import = "  portraitAssetForNickname,\n  productCopy,"
          new_import = "  portraitAssetForNickname,\n  productCopy,\n  profileDisplayValue,"
          if old_import in source:
              source = source.replace(old_import, new_import, 1)
          elif new_import not in source:
              raise SystemExit('test import marker missing')
          test_marker = "test('partner preference is derived only from sex', () => {"
          test_block = """test('profile enums are localized before customer-facing display', () => {
  assert.equal(profileDisplayValue('nl', 'relationshipIntent', 'serious_relationship'), 'Serieuze relatie');
  assert.equal(profileDisplayValue('en', 'relationshipIntent', 'serious_relationship'), 'Serious relationship');
  assert.equal(profileDisplayValue('nl', 'lifeStage', 'recent_graduate'), 'Recent afgestudeerd');
  assert.equal(profileDisplayValue('en', 'lifeStage', 'self_employed'), 'Self-employed');
  assert.equal(profileDisplayValue('nl', 'relationshipIntent', 'Kennismaking met huwelijk als doel'), 'Kennismaking met huwelijk als doel');
  assert.equal(profileDisplayValue('nl', 'relationshipIntent', 'future_enum_value'), 'Future enum value');
  assert.equal(profileDisplayValue('nl', 'relationshipIntent', 'serious_relationship').includes('_'), false);
});

"""
          if 'profile enums are localized before customer-facing display' not in source:
              if test_marker not in source:
                  raise SystemExit('test marker missing')
              source = source.replace(test_marker, test_block + test_marker, 1)
          tests.write_text(source)
          PY
          python /tmp/wp069c.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "serious_relationship: 'Serieuze relatie'" apps/private-preview/product-model.js
          grep -Fq "profileDisplayValue(state.language, 'relationshipIntent'" apps/private-preview/product-shell.js
          grep -Fq "profile enums are localized before customer-facing display" apps/web/tests/product-model.test.mjs
          node --check apps/private-preview/product-model.js
          node --check apps/private-preview/product-shell.js
          node --test apps/web/tests/product-model.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/private-preview/product-model.js apps/private-preview/product-shell.js apps/web/tests/product-model.test.mjs
          git commit -m 'fix(profile): localize stored enum values before display'
          git push origin HEAD:fix/wp069c-display-labels
