name: Verify WP069B profile image preparation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-wp069b-profile-image-preparation.yml'
      - 'apps/private-preview/account-shell.js'
      - 'apps/private-preview/profile-image-preparation.js'
      - 'apps/private-preview/profile-image-preparation.css'
      - 'apps/web/src/profile-image-preparation.js'
      - 'scripts/build-private-preview.mjs'
      - 'scripts/finalize-discovery-deck-artifact.mjs'
      - 'scripts/validate-wp069b-profile-image-preparation.mjs'
      - 'scripts/verify-wp069b-profile-image-staging.sh'
      - 'supabase/migrations/20260805084500_profile_image_preparation.sql'
      - 'supabase/migrations/20260805084600_profile_image_snapshot_redaction.sql'
      - 'supabase/tests/database/014_profile_image_preparation.test.sql'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-wp069b-profile-image-preparation.yml'
      - 'apps/private-preview/account-shell.js'
      - 'apps/private-preview/profile-image-preparation.js'
      - 'apps/private-preview/profile-image-preparation.css'
      - 'apps/web/src/profile-image-preparation.js'
      - 'scripts/build-private-preview.mjs'
      - 'scripts/finalize-discovery-deck-artifact.mjs'
      - 'scripts/validate-wp069b-profile-image-preparation.mjs'
      - 'scripts/verify-wp069b-profile-image-staging.sh'
      - 'supabase/migrations/20260805084500_profile_image_preparation.sql'
      - 'supabase/migrations/20260805084600_profile_image_snapshot_redaction.sql'
      - 'supabase/tests/database/014_profile_image_preparation.test.sql'
      - 'package.json'
      - 'package-lock.json'
  workflow_run:
    workflows: ['Configure Cloudflare staging backend']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rendezvue-wp069b-profile-images-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate WP-069B verifier contract
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate source, shell and generated artifact contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/verify-wp069b-profile-image-staging.sh
          node --check scripts/validate-wp069b-profile-image-preparation.mjs
          node --check apps/private-preview/profile-image-preparation.js
          node --check apps/web/src/profile-image-preparation.js
          npm ci
          npm run build:cloudflare
          node scripts/validate-wp069b-profile-image-preparation.mjs

          required=(
            'read_only: true'
            'prepared_column_count'
            'selected_non_card_count'
            'duplicate_selected_account_count'
            'snapshot_redacts_source_path'
            'registration_serialized'
          )
          for marker in "${required[@]}"; do
            grep --fixed-strings --quiet "$marker" scripts/verify-wp069b-profile-image-staging.sh || {
              echo "::error title=Missing protected verifier marker::$marker"
              exit 1
            }
          done

          forbidden=(
            'delete[[:space:]]+from'
            'truncate[[:space:]]+'
            'drop[[:space:]]+table'
            'update[[:space:]]+public\.privacy_portraits'
            'insert[[:space:]]+into[[:space:]]+public\.privacy_portraits'
          )
          for pattern in "${forbidden[@]}"; do
            if grep --extended-regexp --ignore-case --quiet "$pattern" scripts/verify-wp069b-profile-image-staging.sh; then
              echo "::error title=Unsafe protected verifier pattern::$pattern"
              exit 1
            fi
          done

  verify:
    name: Verify canonical image preparation and protected schema
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: rendezvue-private-preview
    env:
      STAGING_URL: https://rendezvue-private-preview.pages.dev/
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo '::error title=Invalid commit::EXPECTED_SHA is not a full Git commit'
            exit 1
          }
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || {
            echo '::error title=Missing token::SUPABASE_ACCESS_TOKEN is not configured'
            exit 1
          }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]] || {
            echo '::error title=Invalid project reference::SUPABASE_PROJECT_REF has an unexpected format'
            exit 1
          }

      - name: Wait for commit-matched canonical deployment
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/deployment.json"
          matched=false
          for attempt in {1..72}; do
            status="$(curl --silent --show-error --location \
              --output "$metadata" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}deployment.json?commit=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            if [[ "$status" == "200" ]] && node --input-type=module --eval "
              import { readFileSync } from 'node:fs';
              const value = JSON.parse(readFileSync(process.argv[1], 'utf8'));
              if (value.buildCommit !== process.argv[2]) process.exit(1);
              if (value.hostingPlatform !== 'cloudflare-pages') process.exit(1);
              if (value.remoteBackendConfigured !== true) process.exit(1);
              if (value.configurationMode !== 'remote-supabase') process.exit(1);
              if (value.realUserAdmissionAuthorized !== false) process.exit(1);
            " "$metadata" "$EXPECTED_SHA"; then
              matched=true
              break
            fi
            echo "Canonical deployment is not commit-matched yet (attempt $attempt, HTTP $status)."
            sleep 10
          done
          [[ "$matched" == "true" ]] || {
            echo '::error title=Deployment did not converge::WP-069B canonical deployment was not commit-matched within 12 minutes.'
            [[ -f "$metadata" ]] && cat "$metadata" || true
            exit 1
          }

      - name: Verify delivered framing editor and resilient rendering
        shell: bash
        run: |
          set -euo pipefail
          fetch_artifact() {
            local relative_path="$1"
            local destination="$2"
            local status
            status="$(curl --silent --show-error --location \
              --output "$destination" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}${relative_path}?commit=${EXPECTED_SHA}" || true)"
            [[ "$status" == "200" ]] || {
              echo "::error title=WP-069B artifact missing::${relative_path} returned HTTP ${status}."
              exit 1
            }
          }

          account_shell="$RUNNER_TEMP/account-shell.js"
          controller="$RUNNER_TEMP/profile-image-preparation.js"
          model="$RUNNER_TEMP/profile-image-model.js"
          css="$RUNNER_TEMP/profile-image-preparation.css"
          headers="$RUNNER_TEMP/wp069b-headers.txt"

          fetch_artifact 'account-shell.js' "$account_shell"
          fetch_artifact 'profile-image-preparation.js' "$controller"
          fetch_artifact 'src/profile-image-preparation.js' "$model"
          fetch_artifact 'profile-image-preparation.css' "$css"

          grep -Fq "import './profile-image-preparation.js';" "$account_shell"
          grep -Fq 'wp069b-profile-image-preparation' "$controller"
          grep -Fq "event.stopImmediatePropagation();" "$controller"
          grep -Fq "createImageBitmap(file, { imageOrientation: 'from-image' })" "$controller"
          grep -Fq "canvas.toBlob" "$controller"
          grep -Fq "supabase.rpc('register_prepared_portrait'" "$controller"
          grep -Fq 'cardWidth: 960' "$model"
          grep -Fq 'cardHeight: 1200' "$model"
          grep -Fq 'avatarWidth: 384' "$model"
          grep -Fq 'card-4x5.webp' "$model"
          grep -Fq 'avatar-square.webp' "$model"
          grep -Fq 'aspect-ratio: 4 / 5;' "$css"
          grep -Fq 'object-fit: contain !important;' "$css"
          grep -Fq 'filter: blur(20px)' "$css"
          grep -Fq '.rv-image-safe-area' "$css"

          if grep -Eiq 'service_role|sb_secret_|SUPABASE_SERVICE_ROLE_KEY|auth\.admin|createClient\s*\(' "$controller"; then
            echo '::error title=Privileged browser capability exposed::WP-069B controller contains prohibited privileged material.'
            exit 1
          fi
          if grep -Eq 'cardObjectPath:[[:space:]]*paths\.card|avatarObjectPath:[[:space:]]*paths\.avatar' "$controller"; then
            echo '::error title=Private path event leak::WP-069B controller broadcasts private Storage coordinates.'
            exit 1
          fi

          for route in profile-image-preparation.js profile-image-preparation.css src/profile-image-preparation.js; do
            curl --silent --show-error --location --head \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}${route}?commit=${EXPECTED_SHA}" > "$headers"
            grep -Eiq '^cache-control:.*no-cache' "$headers" || {
              echo "::error title=Stale WP-069B asset risk::${route} is not revalidated."
              exit 1
            }
            grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$headers" || {
              echo "::error title=Security header missing::${route} lacks nosniff."
              exit 1
            }
          done

      - name: Verify protected Supabase preparation contract
        shell: bash
        run: bash scripts/verify-wp069b-profile-image-staging.sh

      - name: Write verification summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## WP-069B participant profile image preparation

          - Canonical URL: $STAGING_URL
          - Commit matched: \`$EXPECTED_SHA\`
          - User-controlled 4:5 framing: passed
          - Square avatar derivative contract: passed
          - Normalized private source: passed
          - Safe-area and zoom controls: passed
          - Resilient contain + blurred-background rendering: passed
          - Private path browser-event leak: absent
          - Prepared portrait schema and RPC: passed
          - Anonymous registration: denied
          - One selected card per account: enforced
          - Source/avatar publication: prohibited
          - Snapshot Storage paths: redacted
          - Real-user admission authorized: no
          EOF

      - name: Record successful WP-069B verification
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-069B canonical verification passed' \
            '' \
            "- commit: \`$EXPECTED_SHA\`" \
            "- workflow: $RUN_URL" \
            '- canonical framing editor and resilient rendering: passed' \
            '- normalized source, 4:5 card and square avatar schema: passed' \
            '- exact private path and privilege boundaries: passed' \
            '- onboarding snapshot path redaction: passed' \
            '- real-user admission: not authorized' \
            | gh issue comment 91 --repo "$GITHUB_REPOSITORY" --body-file -

      - name: Record WP-069B verification failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-069B canonical verification failed' \
            '' \
            "- commit: \`$EXPECTED_SHA\`" \
            "- workflow: $RUN_URL" \
            '- result: deployment, browser artifact, protected schema, path isolation or rendering contract did not pass' \
            '- real-user admission remains unauthorized' \
            | gh issue comment 91 --repo "$GITHUB_REPOSITORY" --body-file -
