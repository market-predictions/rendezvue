name: Repair WP073 safety selector

on:
  push:
    branches:
      - ux/wp073-conversation-inbox
    paths:
      - '.github/workflows/repair-wp073-safety-css.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Repair selector and validate complete product
        shell: bash
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/private-preview/product-shell.css')
          source = path.read_text(encoding='utf-8')
          before = '.rv-safety-grid {.rv-safety-grid {'
          if source.count(before) != 1:
              raise RuntimeError('expected duplicated safety selector exactly once')
          path.write_text(source.replace(before, '.rv-safety-grid {', 1), encoding='utf-8')
          PY
          npm ci
          npm test
          npm run validate:synthetic-seed
          npm run check:cloudflare
          ! grep --fixed-strings --quiet '.rv-safety-grid {.rv-safety-grid {' apps/private-preview/product-shell.css
          ! grep --fixed-strings --quiet '.rv-safety-grid {.rv-safety-grid {' dist-private-preview/product-shell.css

      - name: Commit repaired stylesheet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/private-preview/product-shell.css
          git commit -m 'Fix duplicated safety-grid selector'
          git push origin "HEAD:${GITHUB_REF_NAME}"
