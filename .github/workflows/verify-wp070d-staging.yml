name: Verify WP070D participant appeals staging

on:
  workflow_run:
    workflows: ['Configure Cloudflare staging backend']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rendezvue-wp070d-staging-verification-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Verify protected participant appeal contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rendezvue-private-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STAGING_URL: https://rendezvue-private-preview.pages.dev/
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify exact upstream commit binding
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$TARGET_SHA" ]] || {
            echo "::error title=WP-070D checkout mismatch::Expected $TARGET_SHA but checked out $actual"
            exit 1
          }

      - name: Validate protected verifier configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD STAGING_URL TARGET_SHA; do
            [[ -n "${!name:-}" ]] || { echo "::error title=Missing protected configuration::$name is not configured"; exit 1; }
          done
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]] || { echo '::error title=Invalid project reference::Unexpected project ref'; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error title=Invalid target commit::TARGET_SHA must be a full Git SHA'; exit 1; }

      - name: Resolve read-only Supavisor session connection
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/supabase-pooler.json"
          db_url_file="$RUNNER_TEMP/supabase-db-url.txt"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")"
          [[ "$status" == '200' ]] || { echo "::error title=Database connection discovery failed::HTTP $status"; exit 1; }
          node --input-type=module - "$response" "$db_url_file" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const configs = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const candidates = Array.isArray(configs)
            ? configs.filter((entry) => String(entry?.database_type ?? '').toUpperCase() === 'PRIMARY' && String(entry?.db_host ?? '').endsWith('.pooler.supabase.com'))
            : [];
          if (!candidates.length) throw new Error('No PRIMARY Supavisor pooler configuration was returned');
          const selected = candidates.find((entry) => String(entry?.pool_mode ?? '').toLowerCase() === 'transaction') ?? candidates[0];
          const url = new URL('postgresql://placeholder:placeholder@localhost/postgres');
          url.username = String(selected.db_user);
          url.password = process.env.SUPABASE_DB_PASSWORD;
          url.hostname = String(selected.db_host);
          url.port = '5432';
          url.pathname = `/${String(selected.db_name).replace(/^\/+/, '')}`;
          url.searchParams.set('sslmode', 'require');
          writeFileSync(process.argv[3], url.toString(), { mode: 0o600 });
          NODE
          db_url="$(cat "$db_url_file")"
          echo "::add-mask::$db_url"
          printf 'RENDEZVUE_DB_URL=%s\n' "$db_url" >> "$GITHUB_ENV"

      - name: Verify exact remote WP-070D schema, privacy and no-effect contract
        shell: bash
        run: |
          set -euo pipefail
          psql "$RENDEZVUE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare v_missing text[] := '{}'::text[];
          begin
            if not exists (select 1 from supabase_migrations.schema_migrations where version='20260808225000') then v_missing:=array_append(v_missing,'migration 20260808225000'); end if;
            if to_regclass('public.moderation_appeals') is null then v_missing:=array_append(v_missing,'moderation_appeals table'); end if;
            if to_regprocedure('public.list_my_moderation_notices()') is null then v_missing:=array_append(v_missing,'list_my_moderation_notices()'); end if;
            if to_regprocedure('public.submit_moderation_appeal(uuid,text,text)') is null then v_missing:=array_append(v_missing,'submit_moderation_appeal(...)'); end if;
            if to_regprocedure('public.list_pending_moderation_appeals(integer)') is null then v_missing:=array_append(v_missing,'list_pending_moderation_appeals(integer)'); end if;
            if to_regprocedure('public.review_moderation_appeal(uuid,text,text,text)') is null then v_missing:=array_append(v_missing,'review_moderation_appeal(...)'); end if;
            if cardinality(v_missing)>0 then raise exception 'WP-070D remote contract missing: %',array_to_string(v_missing,', '); end if;
          end $$;

          do $$
          declare
            v_notice text := pg_get_functiondef('public.list_my_moderation_notices()'::regprocedure);
            v_review text := pg_get_functiondef('public.review_moderation_appeal(uuid,text,text,text)'::regprocedure);
          begin
            if position('reporter_user_id' in v_notice)>0 or position('description' in v_notice)>0
               or position('proposed_by_ref' in v_notice)>0 or position('reviewer_ref' in v_notice)>0
               or position('executed_by_ref' in v_notice)>0 then
              raise exception 'participant notice projection exposes prohibited internal/reporter evidence';
            end if;
            if position('moderation appeal requires an independent reviewer' in v_review)=0 then
              raise exception 'appeal reviewer independence gate missing';
            end if;
            if v_review ~* '(insert[[:space:]]+into|update|delete[[:space:]]+from)[[:space:]]+public[.]moderation_restrictions'
               or v_review ~* '(insert[[:space:]]+into|update|delete[[:space:]]+from)[[:space:]]+auth[.]users' then
              raise exception 'appeal review contains prohibited effect authority';
            end if;
          end $$;

          do $$
          begin
            if not exists(select 1 from pg_class where oid='public.moderation_appeals'::regclass and relrowsecurity) then raise exception 'appeal RLS disabled'; end if;
            if not has_table_privilege('service_role','public.moderation_appeals','SELECT') then raise exception 'service role appeal read missing'; end if;
            if has_table_privilege('service_role','public.moderation_appeals','INSERT') or has_table_privilege('service_role','public.moderation_appeals','UPDATE') or has_table_privilege('service_role','public.moderation_appeals','DELETE') then raise exception 'service role can bypass appeal RPC mutation'; end if;
            if has_table_privilege('authenticated','public.moderation_appeals','SELECT') or has_table_privilege('anon','public.moderation_appeals','SELECT') then raise exception 'participant can inspect raw appeal state'; end if;
            if not has_function_privilege('authenticated','public.list_my_moderation_notices()','EXECUTE') or not has_function_privilege('authenticated','public.submit_moderation_appeal(uuid,text,text)','EXECUTE') then raise exception 'participant bounded notice/submit capability missing'; end if;
            if has_function_privilege('authenticated','public.list_pending_moderation_appeals(integer)','EXECUTE') or has_function_privilege('authenticated','public.review_moderation_appeal(uuid,text,text,text)','EXECUTE') then raise exception 'participant can access internal appeal operations'; end if;
            if not has_function_privilege('service_role','public.list_pending_moderation_appeals(integer)','EXECUTE') or not has_function_privilege('service_role','public.review_moderation_appeal(uuid,text,text,text)','EXECUTE') then raise exception 'service controlled appeal operations missing'; end if;
          end $$;

          do $$
          begin
            if exists(select 1 from public.moderation_enforcement_policies where active) then raise exception 'active enforcement policies must remain zero'; end if;
            if exists(select 1 from public.moderation_enforcement_policies where scope <> 'synthetic_only') then raise exception 'real-user enforcement scope unexpectedly exists'; end if;
          end $$;
          SQL

      - name: Verify exact canonical deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/wp070d-deployment.json"
          matched=false
          for attempt in {1..72}; do
            status="$(curl --silent --show-error --location --output "$metadata" --write-out '%{http_code}' --header 'cache-control: no-cache' "${STAGING_URL}deployment.json?wp070d=${TARGET_SHA}&attempt=${attempt}" || true)"
            if [[ "$status" == '200' ]] && node --input-type=module - "$metadata" "$TARGET_SHA" <<'NODE'
          import { readFileSync } from 'node:fs';
          const doc=JSON.parse(readFileSync(process.argv[2],'utf8'));
          if (doc.buildCommit!==process.argv[3]) process.exit(1);
          if (doc.hostingPlatform!=='cloudflare-pages') process.exit(1);
          if (doc.configurationMode!=='remote-supabase') process.exit(1);
          if (doc.remoteBackendConfigured!==true) process.exit(1);
          if (doc.realUserAdmissionAuthorized!==false) process.exit(1);
          NODE
            then matched=true; break; fi
            sleep 10
          done
          [[ "$matched" == true ]] || { echo '::error title=WP-070D canonical boundary mismatch::Deployment did not converge to exact target SHA with admission disabled.'; exit 1; }

      - name: Write WP-070D verification summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## WP-070D protected staging verification
          - exact verified commit: \`$TARGET_SHA\`
          - participant notice/appeal schema and privilege boundary: passed
          - participant projection internal/reporter evidence leak check: passed
          - appeal reviewer independence marker: passed
          - appeal review restriction/Auth mutation capability: absent
          - active enforcement policies: **0**
          - policy scope: synthetic-only
          - canonical deployment: exact commit matched
          - real-user admission: not authorized
          EOF

      - name: Record WP-070D protected verification
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 147 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## WP-070D protected staging verification PASS

          - exact verified commit: \`$TARGET_SHA\`
          - workflow: $RUN_URL
          - remote notice/appeal/RLS/privilege/privacy/no-effect contract: passed
          - active enforcement policies: **0**
          - policy scope: synthetic-only
          - canonical deployment boundary: commit matched
          - real-user admission: not authorized
          EOF

      - name: Record WP-070D protected verification failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 147 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## WP-070D protected staging verification failed

          - target commit: \`$TARGET_SHA\`
          - workflow: $RUN_URL
          - no WP-070D remote completion is claimed
          - real-user admission: not authorized
          EOF
