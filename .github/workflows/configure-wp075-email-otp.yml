name: Configure WP-075 email OTP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-wp075-email-otp.yml'
      - 'config/wp075-email-otp-activation.json'
      - 'supabase/templates/magic-link.html'
      - 'supabase/config.toml'
      - 'apps/web/src/auth-session.js'
      - 'apps/web/src/account-experience.js'
      - 'apps/private-preview/email-otp-controller.js'
      - 'apps/private-preview/email-otp.css'
      - 'scripts/finalize-wp075-email-otp-artifact.mjs'
      - 'scripts/validate-wp075-email-otp.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendezvue-wp075-email-otp
  cancel-in-progress: false

jobs:
  configure:
    name: Configure and verify hosted passwordless email OTP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: rendezvue-private-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      OTP_LENGTH: '6'
      OTP_EXPIRY_SECONDS: '600'

    steps:
      - uses: actions/checkout@v6

      - name: Validate protected configuration and activation contract
        id: activation
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo '::error title=Missing secret::SUPABASE_ACCESS_TOKEN is not configured'; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]] || { echo '::error title=Invalid project reference::SUPABASE_PROJECT_REF has an unexpected format'; exit 1; }
          grep -q 'RENDEZVUE_WP075_EMAIL_OTP_V1' supabase/templates/magic-link.html
          grep -q '{{ .Token }}' supabase/templates/magic-link.html
          grep -q '{{ .ConfirmationURL }}' supabase/templates/magic-link.html

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const activation = JSON.parse(readFileSync('config/wp075-email-otp-activation.json', 'utf8'));
          if (activation.contract !== 'RENDEZVUE_WP075_EMAIL_OTP_ACTIVATION_V1') throw new Error('Unsupported WP-075 activation contract');
          if (activation.realUserAdmissionAuthorized !== false) throw new Error('WP-075 activation contract may not authorize real users');
          if (Number(activation.desiredOtpDigits) !== 6 || Number(activation.desiredOtpExpirySeconds) !== 600) throw new Error('WP-075 desired OTP parameters differ from approved values');
          const ready = activation.hostedDeliveryReady === true;
          if (ready) {
            if (activation.activationState !== 'active-hosted-email-otp' || activation.activePasswordlessPath !== 'email-otp') {
              throw new Error('WP-075 active hosted-delivery state is internally inconsistent');
            }
          } else if (activation.activationState !== 'blocked-external-mail-provider' || activation.activePasswordlessPath !== 'pkce-magic-link') {
            throw new Error('WP-075 blocked hosted-delivery state is internally inconsistent');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `hosted_ready=${ready}\nactivation_state=${activation.activationState}\n`);
          console.log(`WP-075 repository activation state: ${activation.activationState}; hostedReady=${ready}.`);
          NODE

      - name: Configure hosted Auth transactionally
        if: ${{ steps.activation.outputs.hosted_ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const endpoint = `https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_REF}/config/auth`;
          const headers = {
            Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
            'content-type': 'application/json'
          };
          const desired = Object.freeze({
            mailer_templates_magic_link_content: readFileSync('supabase/templates/magic-link.html', 'utf8'),
            mailer_subjects_magic_link: 'Je Rendezvue-code / Your Rendezvue code',
            mailer_otp_length: Number(process.env.OTP_LENGTH),
            mailer_otp_exp: Number(process.env.OTP_EXPIRY_SECONDS)
          });
          const keys = Object.keys(desired);

          function safeApiError(status, raw) {
            let parsed = {};
            try { parsed = JSON.parse(raw); } catch {}
            const allowed = ['code', 'error', 'message', 'msg', 'details'];
            const parts = [];
            for (const key of allowed) {
              const value = parsed?.[key];
              if (typeof value === 'string' && value.trim()) parts.push(`${key}=${value.trim().slice(0, 300)}`);
            }
            return `HTTP ${status}${parts.length ? ` (${parts.join('; ')})` : ''}`;
          }

          async function readHosted() {
            const response = await fetch(endpoint, { headers: { Authorization: headers.Authorization } });
            const raw = await response.text();
            if (!response.ok) throw new Error(`hosted Auth read failed: ${safeApiError(response.status, raw)}`);
            return JSON.parse(raw);
          }

          async function patchOne(key, value, purpose = 'apply') {
            const response = await fetch(endpoint, {
              method: 'PATCH',
              headers,
              body: JSON.stringify({ [key]: value })
            });
            const raw = await response.text();
            if (!response.ok) throw new Error(`${purpose} ${key} failed: ${safeApiError(response.status, raw)}`);
            const observed = await readHosted();
            if (observed[key] !== value) throw new Error(`${purpose} ${key} read-back mismatch`);
          }

          const before = await readHosted();
          const attempted = [];
          try {
            for (const key of keys) {
              if (before[key] === desired[key]) continue;
              // Add before PATCH: a successful write followed by a failed/normalized
              // read-back must still be eligible for restoration.
              attempted.push(key);
              await patchOne(key, desired[key]);
              console.log(`WP-075 applied and read back ${key}.`);
            }
          } catch (error) {
            console.error(`::error title=WP-075 hosted Auth configuration failed::${error.message}`);
            let rollbackFailed = false;
            for (const key of [...attempted].reverse()) {
              try {
                await patchOne(key, before[key], 'rollback');
                console.log(`WP-075 rolled back ${key}.`);
              } catch (rollbackError) {
                rollbackFailed = true;
                console.error(`::error title=WP-075 rollback failed::${rollbackError.message}`);
              }
            }
            if (rollbackFailed) console.error('::error title=WP-075 state warning::Hosted Auth may require manual state reconciliation before another mutation.');
            process.exit(1);
          }

          const final = await readHosted();
          for (const key of keys) {
            if (final[key] !== desired[key]) throw new Error(`final hosted Auth read-back mismatch for ${key}`);
          }
          console.log('Hosted WP-075 email OTP configuration applied transactionally and verified.');
          NODE

      - name: Verify active hosted Auth OTP contract independently
        if: ${{ steps.activation.outputs.hosted_ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/wp075-auth-verification.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"
          [[ "$status" == "200" ]] || { echo "::error title=WP-075 Auth verification failed::HTTP $status"; exit 1; }
          node --input-type=module - "$response" <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (Number(config.mailer_otp_length) !== 6) throw new Error('Hosted email OTP length is not 6');
          if (Number(config.mailer_otp_exp) !== 600) throw new Error('Hosted email OTP expiry is not 600 seconds');
          if (config.mailer_subjects_magic_link !== 'Je Rendezvue-code / Your Rendezvue code') throw new Error('Hosted passwordless email subject differs from the WP-075 contract');
          const template = String(config.mailer_templates_magic_link_content ?? '');
          for (const marker of ['RENDEZVUE_WP075_EMAIL_OTP_V1', '{{ .Token }}', '{{ .ConfirmationURL }}']) {
            if (!template.includes(marker)) throw new Error(`Hosted passwordless template is missing ${marker}`);
          }
          console.log('Hosted WP-075 email OTP configuration independently read back and verified.');
          NODE

      - name: Verify blocked hosted state read-only
        if: ${{ steps.activation.outputs.hosted_ready != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/wp075-blocked-auth-state.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"
          [[ "$status" == "200" ]] || { echo "::error title=WP-075 blocked-state read failed::HTTP $status"; exit 1; }
          node --input-type=module - "$response" <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const template = String(config.mailer_templates_magic_link_content ?? '');
          if (template.includes('RENDEZVUE_WP075_EMAIL_OTP_V1') || template.includes('{{ .Token }}')) {
            throw new Error('Hosted provider now appears to expose the Rendezvue OTP template while repository activation remains blocked; reconcile and independently assure activation instead of silently continuing.');
          }
          console.log(`WP-075 hosted delivery remains blocked/dormant; read-only check observed no active Rendezvue OTP template. Hosted otp_length=${Number(config.mailer_otp_length) || 'unknown'}, otp_exp=${Number(config.mailer_otp_exp) || 'unknown'}.`);
          NODE

      - name: Write WP-075 configuration summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## WP-075 hosted passwordless state

          - repository activation state: \`${{ steps.activation.outputs.activation_state }}\`
          - hosted OTP delivery ready: \`${{ steps.activation.outputs.hosted_ready }}\`
          - hosted mutation attempted: \`${{ steps.activation.outputs.hosted_ready }}\`
          - blocked state uses read-only provider verification only
          - password fallback introduced: no
          - cross-browser session propagation introduced: no
          - real-user admission authorized: no
          EOF
