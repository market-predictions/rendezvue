name: Apply complete WP069C relationship localization

on:
  push:
    branches:
      - agent/wp069c-complete-relationship-localization
    paths:
      - '.github/workflows/patch-wp069c-complete-relationship-localization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Complete relationship-intent localization and governance
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | python -c 'import sys,zlib;exec(zlib.decompress(sys.stdin.buffer.read()))'

      - name: Validate corrected display contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test apps/web/tests/product-model.test.mjs
          npm run validate:synthetic-seed
          npm run build:cloudflare
          grep --fixed-strings --quiet "marriage_oriented: 'Kennismaking met huwelijk als doel'" dist-private-preview/product-model.js
          grep --fixed-strings --quiet "marriage_oriented: 'Getting to know someone with marriage in mind'" dist-private-preview/product-model.js

      - name: Commit completed correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete seeded relationship-intent localization'
          git push origin "HEAD:${GITHUB_REF_NAME}"
