name: Repair WP070 privacy validation

on:
  push:
    branches:
      - feature/wp070-profile-image-preparation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/wp070-profile-image-preparation
          fetch-depth: 0

      - name: Apply privacy and validator corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          controller = Path('apps/private-preview/profile-image-preparation.js')
          source = controller.read_text()
          source = source.replace('        cardObjectPath: paths.card,\n        avatarObjectPath: paths.avatar,\n', '')
          controller.write_text(source)

          validator = Path('scripts/validate-wp070-profile-image-preparation.mjs')
          source = validator.read_text()
          for line in (
              '  requireMarker(source, "source: `${prefix}/source.webp`", `${label} must use a normalized source path`);\n',
              '  requireMarker(source, "card: `${prefix}/card-4x5.webp`", `${label} must use a canonical card derivative path`);\n',
              '  requireMarker(source, "avatar: `${prefix}/avatar-square.webp`", `${label} must use a canonical avatar derivative path`);\n'
          ):
              source = source.replace(line, '')
          model_marker = "  requireMarker(source, 'preparedObjectPaths', `${label} must generate account-scoped private paths`);\n"
          model_paths = model_marker + (
              '  requireMarker(source, "source: `${prefix}/source.webp`", `${label} must use a normalized source path`);\n'
              '  requireMarker(source, "card: `${prefix}/card-4x5.webp`", `${label} must use a canonical card derivative path`);\n'
              '  requireMarker(source, "avatar: `${prefix}/avatar-square.webp`", `${label} must use a canonical avatar derivative path`);\n'
          )
          controller_section, model_section = source.split("for (const [source, label] of [[model, 'source model']", 1)
          if 'must use a normalized source path' not in model_section:
              if model_marker not in source:
                  raise SystemExit('shared model validator marker not found')
              source = source.replace(model_marker, model_paths, 1)
          validator.write_text(source)
          PY

      - name: Verify repaired privacy contract
        run: |
          set -euo pipefail
          ! grep -Fq 'cardObjectPath: paths.card' apps/private-preview/profile-image-preparation.js
          ! grep -Fq 'avatarObjectPath: paths.avatar' apps/private-preview/profile-image-preparation.js
          grep -Fq 'must use a normalized source path' scripts/validate-wp070-profile-image-preparation.mjs
          node --check apps/private-preview/profile-image-preparation.js
          node --check scripts/validate-wp070-profile-image-preparation.mjs

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/private-preview/profile-image-preparation.js \
            scripts/validate-wp070-profile-image-preparation.mjs
          if git diff --cached --quiet; then
            echo 'No privacy repair changes required.'
            exit 0
          fi
          git commit -m 'fix(images): tighten WP-070 privacy and validation boundaries'
          git push origin HEAD:feature/wp070-profile-image-preparation
