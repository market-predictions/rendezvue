name: Deploy and verify WP-065F email replacement

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-verify-wp065f-email-replacement.yml'
      - 'scripts/validate-wp065f-email-replacement.mjs'
      - 'scripts/verify-wp065f-email-replacement-staging.sh'
      - 'supabase/config.toml'
      - 'supabase/functions/execute-account-email-replacement/**'
      - 'supabase/migrations/20260803231500_account_support_email_replacement_actions.sql'
      - 'supabase/migrations/20260803231600_account_email_replacement_cancel_guard.sql'
      - 'supabase/tests/database/013_account_email_replacement_actions.test.sql'
  workflow_run:
    workflows: ['Configure Cloudflare staging backend']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rendezvue-wp065f-email-replacement-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate WP-065F executor contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - name: Type-check and validate email-replacement boundary
        shell: bash
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto supabase/functions/execute-account-email-replacement/index.ts
          node scripts/validate-wp065f-email-replacement.mjs
          bash -n scripts/verify-wp065f-email-replacement-staging.sh

          required=(
            'read_only: true'
            'action_count'
            'event_count'
            'plaintext_email_column_count'
            'service_role_can_complete'
            'dangerous_function_count'
          )
          for marker in "${required[@]}"; do
            grep --fixed-strings --quiet "$marker" scripts/verify-wp065f-email-replacement-staging.sh || {
              echo "::error title=Missing verifier marker::$marker"
              exit 1
            }
          done

          forbidden=(
            'delete[[:space:]]+from'
            'truncate[[:space:]]+'
            'drop[[:space:]]+table'
            'update[[:space:]]+auth\.users'
            'insert[[:space:]]+into[[:space:]]+auth\.users'
            'select[[:space:]]+public\.request_account_email_replacement'
            'select[[:space:]]+public\.approve_account_email_replacement'
            'select[[:space:]]+public\.claim_account_email_replacement_execution'
            'select[[:space:]]+public\.complete_account_email_replacement'
            'supabase[[:space:]]+db[[:space:]]+reset[[:space:]]+--linked'
          )
          for pattern in "${forbidden[@]}"; do
            if grep --extended-regexp --ignore-case --quiet "$pattern" scripts/verify-wp065f-email-replacement-staging.sh; then
              echo "::error title=Unsafe verifier pattern::$pattern"
              exit 1
            fi
          done

  deploy_and_verify:
    name: Deploy and verify protected WP-065F state
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: rendezvue-private-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_PUBLISHABLE_KEY)
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || {
              echo "::error title=Missing protected configuration::$name is not configured"
              exit 1
            }
          done
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]] || {
            echo '::error title=Invalid project reference::SUPABASE_PROJECT_REF has an unexpected format'
            exit 1
          }
          [[ "$SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]] || {
            echo '::error title=Unsafe browser key::Expected an sb_publishable_ key'
            exit 1
          }

      - name: Deploy internal email-replacement executor
        run: supabase functions deploy execute-account-email-replacement --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify ordinary invocation is rejected
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/wp065f-unauthorized.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'content-type: application/json' \
            --data '{"actionId":"00000000-0000-4000-8000-000000000000","idempotencyKey":"unauthorized-proof-0001","targetEmail":"nobody@example.test"}' \
            "$SUPABASE_URL/functions/v1/execute-account-email-replacement")"
          [[ "$status" == "401" ]] || {
            echo "::error title=Email replacement auth gate failed::Expected 401, received $status"
            exit 1
          }

      - name: Verify remote schema, empty state and least privilege
        shell: bash
        run: bash scripts/verify-wp065f-email-replacement-staging.sh

      - name: Write verification summary
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065F remote email-replacement verification' \
            '' \
            '- Action/event schema: present' \
            '- Actions/events: 0 / 0' \
            '- Plaintext e-mail columns: 0' \
            '- Anonymous/authenticated access: denied' \
            '- Service-role direct table writes: denied' \
            '- Controlled request/approve/execute/finalize functions: allowed' \
            '- Edge Function ordinary invocation: rejected with HTTP 401' \
            '- Account merge/password/deletion functions: absent' \
            '- E-mail replacement executed: no' \
            '- Real-user admission authorized: no' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful WP-065F verification
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065F remote foundation verification passed' \
            '' \
            "- commit: \`$GITHUB_SHA\`" \
            "- workflow: $RUN_URL" \
            '- action/event schema: present' \
            '- actions/events: 0 / 0' \
            '- plaintext e-mail columns: 0' \
            '- ordinary-user access and invocation: denied' \
            '- service-role direct writes: denied' \
            '- controlled functions and internal executor: deployed' \
            '- account merge/password/deletion functions: absent' \
            '- no e-mail replacement was executed by this verifier' \
            '- real-user admission: not authorized' \
            | gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body-file -

      - name: Record failed WP-065F verification
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065F remote foundation verification failed' \
            '' \
            "- commit: \`$GITHUB_SHA\`" \
            "- workflow: $RUN_URL" \
            '- result: deploy, auth gate, schema, empty-state or privilege contract did not pass' \
            '- no e-mail replacement is accepted or authorized' \
            '- real-user admission remains unauthorized' \
            | gh issue comment 68 --repo "$GITHUB_REPOSITORY" --body-file -
