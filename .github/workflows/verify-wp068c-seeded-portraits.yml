name: Verify WP-068C seeded portraits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-wp068c-seeded-portraits.yml'
      - 'apps/private-preview/discovery-portrait-fallback.js'
      - 'scripts/finalize-discovery-deck-artifact.mjs'
      - 'scripts/validate-wp068c-seeded-portraits.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rendezvue-wp068c-production-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify canonical seeded portrait fallback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_URL: https://rendezvue-private-preview.pages.dev/

    steps:
      - name: Wait for commit-matched Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/deployment.json"
          matched=false
          for attempt in {1..72}; do
            status="$(curl --silent --show-error --location --output "$metadata" --write-out '%{http_code}' --header 'cache-control: no-cache' "${STAGING_URL}deployment.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if [[ "$status" == "200" ]] && node --input-type=module --eval "
              import { readFileSync } from 'node:fs';
              const document = JSON.parse(readFileSync(process.argv[1], 'utf8'));
              if (document.buildCommit !== process.argv[2]) process.exit(1);
              if (document.configurationMode !== 'remote-supabase') process.exit(1);
              if (document.remoteBackendConfigured !== true) process.exit(1);
              if (document.realUserAdmissionAuthorized !== false) process.exit(1);
            " "$metadata" "$GITHUB_SHA"; then
              matched=true
              break
            fi
            echo "WP-068C deployment not commit-matched yet (attempt $attempt, HTTP $status)."
            sleep 10
          done
          [[ "$matched" == "true" ]] || { echo '::error title=WP-068C deployment did not converge::Canonical deployment was not commit-matched within 12 minutes.'; exit 1; }

      - name: Verify delivered fallback and portrait assets
        shell: bash
        run: |
          set -euo pipefail
          index="$RUNNER_TEMP/index.html"
          fallback="$RUNNER_TEMP/discovery-portrait-fallback.js"
          manifest="$RUNNER_TEMP/manifest.json"

          curl --silent --show-error --location --fail --header 'cache-control: no-cache' "${STAGING_URL}?commit=${GITHUB_SHA}" > "$index"
          curl --silent --show-error --location --fail --header 'cache-control: no-cache' "${STAGING_URL}discovery-portrait-fallback.js?commit=${GITHUB_SHA}" > "$fallback"
          curl --silent --show-error --location --fail --header 'cache-control: no-cache' "${STAGING_URL}assets/profiles/manifest.json?commit=${GITHUB_SHA}" > "$manifest"

          grep -Fq "./discovery-portrait-fallback.js?commit=${GITHUB_SHA}" "$index" || { echo '::error title=WP-068C module entry missing::Canonical index does not load the commit-versioned fallback.'; exit 1; }
          grep -Fq 'seededPortraitAssetForDisplayName' "$fallback" || { echo '::error title=WP-068C resolver missing::Fallback resolver is absent.'; exit 1; }
          grep -Fq "tokens.find((token) => SEEDED_PORTRAIT_SET.has(token))" "$fallback" || { echo '::error title=WP-068C allowlist missing::Fallback is not token-allowlisted.'; exit 1; }
          grep -Fq "image.dataset.syntheticPortraitFallback = 'seeded'" "$fallback" || { echo '::error title=WP-068C repair marker missing::Repaired images are not marked.'; exit 1; }

          node --input-type=module --eval "
            import { readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync(process.argv[1], 'utf8'));
            const expected = ['yasmin','bilal','amina','idris','maryam','samir','noura','youssef','hafsa','omar'];
            if (manifest.syntheticOnly !== true) process.exit(1);
            if (JSON.stringify(manifest.names) !== JSON.stringify(expected)) process.exit(1);
          " "$manifest"

          for name in amina youssef hafsa; do
            status="$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' "${STAGING_URL}assets/profiles/${name}.webp?commit=${GITHUB_SHA}" || true)"
            [[ "$status" == "200" ]] || { echo "::error title=WP-068C portrait missing::${name}.webp returned HTTP ${status}."; exit 1; }
          done

          if grep -Eiq 'https?://|supabase|storage|signedUrl|createClient|service_role|auth\.admin' "$fallback"; then
            echo '::error title=WP-068C privileged or external portrait source::Fallback contains prohibited dependencies.'
            exit 1
          fi

      - name: Record WP-068C production evidence
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 85 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## WP-068C canonical seeded portrait fallback verified

          - canonical URL: $STAGING_URL
          - commit: \`$GITHUB_SHA\`
          - workflow: $RUN_URL
          - commit-versioned fallback module: passed
          - approved synthetic name-token resolution: passed
          - seeded portrait manifest and delivery: passed
          - external/private portrait sources: absent
          - real-user admission: not authorized
          EOF

      - name: Record WP-068C verification failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 85 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## WP-068C canonical verification failed

          - expected commit: \`$GITHUB_SHA\`
          - workflow: $RUN_URL
          - result: commit matching, fallback module or synthetic portrait delivery failed
          - real-user admission: not authorized
          EOF
