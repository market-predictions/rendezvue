name: Patch WP076 closeout

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-wp076-closeout.yml'
      - 'scripts/patch-wp076-closeout.py'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply WP076 closeout records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rendezvue-governance-bot'
          git config user.email 'rendezvue-governance-bot@users.noreply.github.com'
          python scripts/patch-wp076-closeout.py
          git add CHANGELOG.md docs/DATA-MODEL.md docs/HANDOVER.md docs/ROADMAP.md docs/WORK-CLAIMS.md docs/WORKPACKAGES.md docs/WP-076-LIVE-SELFIE-PROFILE-MEDIA.md
          git commit -m 'Close out WP076 technical delivery'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
