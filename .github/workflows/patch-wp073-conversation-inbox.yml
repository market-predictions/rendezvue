name: Apply WP073 conversation inbox integration

on:
  push:
    branches:
      - ux/wp073-conversation-inbox
    paths:
      - '.github/workflows/patch-wp073-conversation-inbox.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Integrate scalable matches and conversations UX
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              if source.count(before) != 1:
                  raise RuntimeError(f'{path}: expected exactly one marker for replacement')
              file.write_text(source.replace(before, after, 1), encoding='utf-8')

          def replace_between(path, start, end, replacement):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              left = source.find(start)
              right = source.find(end, left + len(start))
              if left < 0 or right < 0:
                  raise RuntimeError(f'{path}: range markers not found')
              file.write_text(source[:left] + replacement + source[right:], encoding='utf-8')

          shell = 'apps/private-preview/product-shell.js'
          replace_once(
              shell,
              "import { contactOpenErrorMessage } from './contact-entitlement-model.js';\n",
              "import { contactOpenErrorMessage } from './contact-entitlement-model.js';\nimport { createConversationInboxController } from './conversation-inbox-controller.js';\n"
          )
          replace_once(
              shell,
              "  discovery: [],\n  activeMatch: null,\n  activeConversation: null,\n  otherUserId: null,\n  otherProfile: null,\n  matchedPortraitUrl: null,\n  realtimeChannel: null\n",
              "  discovery: []\n"
          )

          matches_template = '''      <section class="rv-view" data-rv-view="matches">
        <article class="rv-card rv-inbox-card">
          <div class="rv-section-heading">
            <div>
              <h2 data-rv-i18n="matches.title">Matches en gesprekken</h2>
              <p data-rv-i18n="matches.intro">Bekijk nieuwe matches en ga verder waar je gebleven bent.</p>
            </div>
            <button id="rv-refresh-match" class="secondary" type="button" data-rv-i18n="matches.refresh">Vernieuwen</button>
          </div>
          <div id="rv-match-status" class="rv-status" role="status" aria-live="polite" hidden></div>

          <div id="rv-messaging-shell" class="rv-messaging-shell">
            <aside class="rv-thread-panel" aria-label="Matches en gesprekken">
              <section id="rv-conversation-section" class="rv-thread-section">
                <h3 data-rv-i18n="matches.conversations">Gesprekken</h3>
                <div id="rv-conversation-list" class="rv-thread-list"></div>
              </section>
              <section id="rv-new-match-section" class="rv-thread-section">
                <h3 data-rv-i18n="matches.newMatches">Nieuwe matches</h3>
                <div id="rv-new-match-list" class="rv-thread-list"></div>
              </section>
              <section id="rv-ended-match-section" class="rv-thread-section">
                <h3 data-rv-i18n="matches.endedContacts">Eerdere contacten</h3>
                <div id="rv-ended-match-list" class="rv-thread-list"></div>
              </section>
            </aside>

            <section id="rv-conversation-panel" class="rv-conversation-panel" aria-label="Geselecteerd gesprek">
              <header id="rv-conversation-header" class="rv-conversation-header"></header>
              <div id="rv-chat-list" class="rv-chat"><div class="rv-chat-empty" data-rv-i18n="matches.selectConversationHint">Kies links een gesprek of nieuwe match.</div></div>
              <form id="rv-chat-form" class="rv-chat-form" hidden>
                <label class="rv-visually-hidden" for="rv-message-body" data-rv-i18n="chat.title">Gesprek</label>
                <input id="rv-message-body" maxlength="4000" required data-rv-i18n-placeholder="chat.placeholder" placeholder="Schrijf een bericht…">
                <button type="submit" data-rv-i18n="chat.send">Versturen</button>
              </form>
            </section>
          </div>
        </article>

        <article id="rv-safety-card" class="rv-card" hidden>
          <h2 data-rv-i18n="safety.title">Contact en veiligheid</h2>
          <div class="rv-safety-grid">
            <button id="rv-end-contact" class="secondary" type="button" data-rv-i18n="safety.end">Contact beëindigen</button>
            <button id="rv-block-user" class="danger" type="button" data-rv-i18n="safety.block">Blokkeren</button>
            <button id="rv-toggle-report" class="secondary" type="button" data-rv-i18n="safety.report">Melden</button>
          </div>
          <form id="rv-report-form" class="rv-report-form">
            <label><span data-rv-i18n="safety.reportCategory">Wat is er aan de hand?</span><select id="rv-report-category"><option value="hidden_relationship" data-rv-i18n="safety.hiddenRelationship">Mogelijk verborgen relatie</option><option value="scam_money" data-rv-i18n="safety.scam">Geldvraag of scam</option><option value="harassment" data-rv-i18n="safety.harassment">Druk of intimidatie</option><option value="other_proof" data-rv-i18n="safety.other">Iets anders</option></select></label>
            <label><span data-rv-i18n="safety.description">Korte toelichting</span><textarea id="rv-report-description" maxlength="4000"></textarea></label>
            <button type="submit" data-rv-i18n="safety.submit">Private melding versturen</button>
          </form>
          <div id="rv-safety-status" class="rv-status" role="status" hidden></div>
        </article>
      </section>

'''
          replace_between(
              shell,
              '      <section class="rv-view" data-rv-view="matches">',
              '      <section class="rv-view" data-rv-view="account">',
              matches_template
          )

          replace_once(
              shell,
              "const matchStatus = document.querySelector('#rv-match-status');\nconst matchContent = document.querySelector('#rv-match-content');\nconst chatList = document.querySelector('#rv-chat-list');\nconst chatForm = document.querySelector('#rv-chat-form');\nconst safetyStatus = document.querySelector('#rv-safety-status');\n",
              "const matchStatus = document.querySelector('#rv-match-status');\n"
          )

          controller_setup = '''function unwrap(result, operation) {
  if (result?.error) throw new Error(`${operation}: ${result.error.message ?? 'unknown error'}`);
  return result?.data ?? null;
}

const conversationInbox = createConversationInboxController({
  supabase,
  getLanguage: () => state.language,
  translate: (key, replacements) => t(key, replacements),
  setStatus,
  errorMessage,
  contactOpenErrorMessage
});
'''
          replace_once(
              shell,
              "function unwrap(result, operation) {\n  if (result?.error) throw new Error(`${operation}: ${result.error.message ?? 'unknown error'}`);\n  return result?.data ?? null;\n}\n",
              controller_setup
          )
          replace_once(shell, '  renderMatch();\n  renderMessages();\n', '  conversationInbox.applyLanguage();\n')
          replace_once(
              shell,
              "  if (tab === 'matches') loadMatch().catch((error) => setStatus(matchStatus, errorMessage(error), 'error'));",
              "  if (tab === 'matches') conversationInbox.load(state.user).catch((error) => setStatus(matchStatus, errorMessage(error), 'error'));"
          )
          replace_once(
              shell,
              '  await Promise.allSettled([loadDiscovery(), loadMatch()]);',
              '  await Promise.allSettled([loadDiscovery(), conversationInbox.load(state.user)]);'
          )
          replace_once(
              shell,
              "    if (signalType === 'like') await loadMatch();",
              "    if (signalType === 'like') await conversationInbox.load(state.user);"
          )
          replace_between(shell, 'function otherParticipant(match) {', 'function bindEvents() {', 'function bindEvents() {')

          for obsolete in [
              "  document.querySelector('#rv-refresh-match')?.addEventListener('click', () => loadMatch().catch((error) => setStatus(matchStatus, errorMessage(error), 'error')));\n",
              "  chatForm?.addEventListener('submit', sendMessage);\n",
              "  document.querySelector('#rv-end-contact')?.addEventListener('click', endContact);\n",
              "  document.querySelector('#rv-block-user')?.addEventListener('click', blockUser);\n",
              "  document.querySelector('#rv-toggle-report')?.addEventListener('click', () => document.querySelector('#rv-report-form').classList.toggle('open'));\n",
              "  document.querySelector('#rv-report-form')?.addEventListener('submit', submitReport);\n"
          ]:
              replace_once(shell, obsolete, '')

          replace_once(
              shell,
              "async function setUser(user) {\n  state.user = user ?? null;\n  if (!state.user) {",
              "async function setUser(user) {\n  state.user = user ?? null;\n  await conversationInbox.setUser(state.user);\n  if (!state.user) {"
          )
          replace_once(
              shell,
              "    state.discovery = [];\n    state.activeMatch = null;\n    state.activeConversation = null;\n    state.otherUserId = null;\n    state.messages = [];\n    if (state.realtimeChannel) await supabase.removeChannel(state.realtimeChannel);\n    state.realtimeChannel = null;\n",
              "    state.discovery = [];\n"
          )
          replace_once(
              shell,
              "    if (state.realtimeChannel) supabase.removeChannel(state.realtimeChannel);\n    if (state.localPortraitUrl) URL.revokeObjectURL(state.localPortraitUrl);",
              "    conversationInbox.destroy();\n    if (state.localPortraitUrl) URL.revokeObjectURL(state.localPortraitUrl);"
          )

          model = 'apps/private-preview/product-model.js'
          nl_before = "    'matches.title': 'Matches en gesprek',\n    'matches.intro': 'Een gesprek ontstaat pas na wederzijdse interesse en een geldig contactrecht.',\n    'matches.refresh': 'Status vernieuwen',\n    'matches.none': 'Nog geen actieve match.',\n    'matches.active': 'Jullie hebben een match.',"
          nl_after = "    'matches.title': 'Matches en gesprekken',\n    'matches.intro': 'Bekijk nieuwe matches en ga verder waar je gebleven bent.',\n    'matches.refresh': 'Vernieuwen',\n    'matches.none': 'Nog geen actieve match.',\n    'matches.conversations': 'Gesprekken',\n    'matches.newMatches': 'Nieuwe matches',\n    'matches.endedContacts': 'Eerdere contacten',\n    'matches.noConversations': 'Nog geen gesprekken.',\n    'matches.noNewMatches': 'Geen nieuwe matches.',\n    'matches.newMatch': 'Nieuwe match',\n    'matches.newMatchHint': 'Jullie hebben elkaar leuk gevonden.',\n    'matches.selectConversation': 'Kies een gesprek',\n    'matches.selectConversationHint': 'Kies links een gesprek of nieuwe match.',\n    'matches.noMessages': 'Nog geen berichten',\n    'matches.unread': 'Nieuw bericht',\n    'matches.conversationActive': 'Gesprek actief',\n    'matches.contactEnded': 'Contact beëindigd',\n    'matches.active': 'Jullie hebben een match.',"
          replace_once(model, nl_before, nl_after)
          replace_once(
              model,
              "    'chat.title': 'Gesprek',\n    'chat.empty': 'Nog geen berichten. Begin rustig en respectvol.',",
              "    'chat.title': 'Gesprek',\n    'chat.activeWith': 'Gesprek met',\n    'chat.back': 'Gesprekken',\n    'chat.empty': 'Nog geen berichten. Begin rustig en respectvol.',"
          )

          en_before = "    'matches.title': 'Matches and conversation',\n    'matches.intro': 'A conversation starts only after mutual interest and a valid contact right.',\n    'matches.refresh': 'Refresh status',\n    'matches.none': 'No active match yet.',\n    'matches.active': 'You have a match.',"
          en_after = "    'matches.title': 'Matches and conversations',\n    'matches.intro': 'See new matches and continue where you left off.',\n    'matches.refresh': 'Refresh',\n    'matches.none': 'No active match yet.',\n    'matches.conversations': 'Conversations',\n    'matches.newMatches': 'New matches',\n    'matches.endedContacts': 'Previous contacts',\n    'matches.noConversations': 'No conversations yet.',\n    'matches.noNewMatches': 'No new matches.',\n    'matches.newMatch': 'New match',\n    'matches.newMatchHint': 'You both liked each other.',\n    'matches.selectConversation': 'Choose a conversation',\n    'matches.selectConversationHint': 'Choose a conversation or new match from the list.',\n    'matches.noMessages': 'No messages yet',\n    'matches.unread': 'New message',\n    'matches.conversationActive': 'Conversation active',\n    'matches.contactEnded': 'Contact ended',\n    'matches.active': 'You have a match.',"
          replace_once(model, en_before, en_after)
          replace_once(
              model,
              "    'chat.title': 'Conversation',\n    'chat.empty': 'No messages yet. Start calmly and respectfully.',",
              "    'chat.title': 'Conversation',\n    'chat.activeWith': 'Conversation with',\n    'chat.back': 'Conversations',\n    'chat.empty': 'No messages yet. Start calmly and respectfully.',"
          )

          css = 'apps/private-preview/product-shell.css'
          new_messaging_css = '''/* WP-073: scalable match and conversation inbox. */
.rv-inbox-card { padding-bottom: 1rem; }
.rv-messaging-shell {
  display: grid;
  grid-template-columns: minmax(17rem, 0.72fr) minmax(0, 1.45fr);
  min-height: 34rem;
  overflow: hidden;
  border: 1px solid #ded5cb;
  border-radius: 1.25rem;
  background: #fff;
}
.rv-thread-panel {
  display: grid;
  align-content: start;
  gap: 1.1rem;
  padding: 1rem;
  border-right: 1px solid #e5ddd4;
  background: linear-gradient(180deg, #fbf8f4 0%, #f6f1eb 100%);
}
.rv-thread-section[hidden] { display: none; }
.rv-thread-section h3 {
  margin: 0 0 0.5rem;
  color: var(--rv-field-label);
  font-size: 0.76rem;
  line-height: 1.2;
  font-weight: 820;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}
.rv-thread-list { display: grid; gap: 0.38rem; }
.rv-thread-empty { margin: 0; color: var(--rv-muted); font-size: 0.82rem; }
.rv-thread-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.72rem;
  width: 100%;
  min-height: 4.65rem;
  padding: 0.68rem;
  border: 1px solid transparent;
  border-radius: 0.95rem;
  background: transparent;
  color: var(--rv-ink);
  text-align: left;
  box-shadow: none;
}
.rv-thread-row:hover { transform: none; border-color: #d8cdc2; background: rgba(255,255,255,0.78); }
.rv-thread-row.selected { border-color: #9dbdaf; background: #fff; box-shadow: 0 8px 22px rgba(33, 95, 80, 0.08); }
.rv-thread-row.unread .rv-thread-preview, .rv-thread-row.unread strong { font-weight: 820; color: var(--rv-ink); }
.rv-thread-avatar, .rv-conversation-avatar {
  overflow: hidden;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 0.85rem;
  background: linear-gradient(145deg, #bed5cc, #edcfbf);
  font-weight: 900;
}
.rv-thread-avatar { width: 3.3rem; height: 3.3rem; font-size: 1rem; }
.rv-thread-avatar img, .rv-conversation-avatar img { width: 100%; height: 100%; object-fit: cover; }
.rv-thread-content { min-width: 0; display: grid; align-content: center; gap: 0.24rem; }
.rv-thread-topline, .rv-thread-bottomline { display: flex; min-width: 0; align-items: center; gap: 0.45rem; }
.rv-thread-topline { justify-content: space-between; }
.rv-thread-topline strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.96rem; }
.rv-thread-topline time { flex: 0 0 auto; color: var(--rv-muted); font-size: 0.7rem; font-weight: 650; }
.rv-thread-preview { min-width: 0; overflow: hidden; color: var(--rv-muted); font-size: 0.8rem; font-weight: 520; text-overflow: ellipsis; white-space: nowrap; }
.rv-unread-dot { width: 0.55rem; height: 0.55rem; flex: 0 0 auto; margin-left: auto; border-radius: 50%; background: var(--rv-green); box-shadow: 0 0 0 3px var(--rv-green-soft); }
.rv-conversation-panel { display: grid; grid-template-rows: auto minmax(16rem, 1fr) auto; min-width: 0; background: #fff; }
.rv-conversation-header {
  min-height: 5.65rem;
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.9rem 1rem;
  border-bottom: 1px solid #e6ddd4;
  background: rgba(255,255,255,0.96);
}
.rv-conversation-header-empty h2 { margin: 0 0 0.2rem; font-size: 1.2rem; }
.rv-conversation-header-empty p { margin: 0; color: var(--rv-muted); }
.rv-conversation-avatar { width: 3.75rem; height: 3.75rem; font-size: 1.15rem; }
.rv-conversation-identity { min-width: 0; }
.rv-conversation-identity h2 { margin: 0.08rem 0 0.18rem; overflow: hidden; font-size: 1.35rem; text-overflow: ellipsis; white-space: nowrap; }
.rv-conversation-identity p { margin: 0; color: var(--rv-muted); font-size: 0.82rem; }
.rv-conversation-eyebrow { color: var(--rv-green-dark); font-size: 0.68rem; font-weight: 850; letter-spacing: 0.06em; text-transform: uppercase; }
.rv-conversation-back { display: none; width: auto; padding: 0.5rem 0.65rem; }
.rv-conversation-start { align-self: center; justify-self: center; max-width: 28rem; padding: 1.4rem; text-align: center; }
.rv-conversation-start h3 { margin: 0 0 0.45rem; }
.rv-conversation-start p { color: var(--rv-muted); line-height: 1.55; }
.rv-conversation-start button { margin-top: 0.45rem; }

.rv-chat { display: grid; align-content: start; gap: 0.65rem; max-height: 34rem; overflow: auto; padding: 1.1rem; }
.rv-chat-empty { align-self: center; color: var(--rv-muted); text-align: center; padding: 2rem 1rem; }
.rv-bubble { max-width: min(82%, 34rem); padding: 0.68rem 0.78rem; border-radius: 1rem 1rem 1rem 0.25rem; background: #eee8e0; }
.rv-bubble.mine { justify-self: end; border-radius: 1rem 1rem 0.25rem 1rem; background: var(--rv-green); color: white; }
.rv-bubble p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.rv-bubble small { display: block; margin-top: 0.3rem; opacity: 0.72; font-size: 0.65rem; }
.rv-chat-form { display: grid; grid-template-columns: 1fr auto; gap: 0.55rem; align-items: end; margin: 0; padding: 0.8rem 1rem 1rem; border-top: 1px solid #e6ddd4; }
.rv-chat-form[hidden] { display: none; }
.rv-chat-form input { margin: 0; min-height: 3rem; }
'''
          replace_between(css, '.rv-match-card {', '.rv-safety-grid {', new_messaging_css + '\n.rv-safety-grid {')

          mobile_css = '''
@media (max-width: 760px) {
  .rv-messaging-shell { grid-template-columns: 1fr; min-height: 29rem; }
  .rv-thread-panel { border-right: 0; }
  .rv-conversation-panel { display: none; min-height: 29rem; }
  .rv-messaging-shell.conversation-open .rv-thread-panel { display: none; }
  .rv-messaging-shell.conversation-open .rv-conversation-panel { display: grid; }
  .rv-conversation-back { display: inline-flex; }
  .rv-conversation-header { padding-inline: 0.8rem; }
  .rv-conversation-avatar { width: 3.35rem; height: 3.35rem; }
  .rv-chat { max-height: 30rem; }
}

'''
          replace_once(css, '@media (max-width: 680px) {', mobile_css + '@media (max-width: 680px) {')
          PY

      - name: Validate integrated conversation inbox
        shell: bash
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run validate:synthetic-seed
          npm run build:cloudflare
          grep --fixed-strings --quiet "createConversationInboxController" dist-private-preview/product-shell.js
          grep --fixed-strings --quiet "rv-messaging-shell" dist-private-preview/product-shell.js
          grep --fixed-strings --quiet "scalable match and conversation inbox" dist-private-preview/product-shell.css

      - name: Commit integrated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/private-preview/product-shell.js apps/private-preview/product-shell.css apps/private-preview/product-model.js
          git commit -m 'Integrate scalable conversation inbox'
          git push origin "HEAD:${GITHUB_REF_NAME}"
