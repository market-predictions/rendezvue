name: Record WP069C governance

on:
  push:
    branches:
      - fix/wp069c-display-labels

permissions:
  contents: write

jobs:
  govern:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/wp069c-display-labels
          fetch-depth: 0

      - name: Update governance records
        shell: bash
        env:
          PATCH_SCRIPT_B64: 
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/wp069c-govern.py
          python /tmp/wp069c-govern.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '## WP-069C — Human-readable customer-facing profile labels' docs/WORKPACKAGES.md
          grep -Fq '**Version:** 2.11' docs/ROADMAP.md
          grep -Fq '### Human-readable customer-facing profile labels' CHANGELOG.md
          grep -Fq '| WC-070 | Stored relationship-intent' docs/WORK-CLAIMS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WORKPACKAGES.md docs/ROADMAP.md docs/HANDOVER.md docs/WORK-CLAIMS.md CHANGELOG.md
          git commit -m 'docs(profile): record WP-069C display-label correction'
          git push origin HEAD:fix/wp069c-display-labels
