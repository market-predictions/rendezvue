name: Apply WP071 governance records

on:
  push:
    branches:
      - ux/wp071-profile-form-hierarchy
    paths:
      - '.github/workflows/patch-wp071-governance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Patch roadmap and governance records
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | python -c 'import sys,zlib;exec(zlib.decompress(sys.stdin.buffer.read()))'

      - name: Validate WP-071 implementation
        shell: bash
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run validate:synthetic-seed
          npm run build:cloudflare
          grep --fixed-strings --quiet 'WP-071: make the value the primary scan target' dist-private-preview/product-shell.css
          grep --fixed-strings --quiet 'font-size: 0.78rem' dist-private-preview/product-shell.css
          grep --fixed-strings --quiet 'font-size: 1.03rem' dist-private-preview/product-shell.css

      - name: Commit governance records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/ROADMAP.md docs/WORKPACKAGES.md docs/WORK-CLAIMS.md docs/HANDOVER.md
          git commit -m 'Document WP-071 profile-form hierarchy'
          git push origin "HEAD:${GITHUB_REF_NAME}"
