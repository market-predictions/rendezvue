name: Verify WP071 profile-form hierarchy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-wp071-profile-form-hierarchy.yml'
      - 'apps/private-preview/product-shell.css'
      - 'apps/web/tests/profile-form-ux.test.mjs'
      - 'scripts/build-private-preview.mjs'
      - 'scripts/copy-product-assets.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_run:
    workflows: ['Configure Cloudflare staging backend']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendezvue-wp071-form-hierarchy-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate profile-form hierarchy contract
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Test source hierarchy and generated artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test apps/web/tests/profile-form-ux.test.mjs
          npm run build:cloudflare

          for file in apps/private-preview/product-shell.css dist-private-preview/product-shell.css; do
            grep --fixed-strings --quiet 'WP-071: make the value the primary scan target' "$file"
            grep --fixed-strings --quiet '.rv-fieldset > label > span' "$file"
            grep --fixed-strings --quiet 'font-size: 0.78rem' "$file"
            grep --fixed-strings --quiet 'font-size: 1.03rem' "$file"
            grep --fixed-strings --quiet 'min-height: 3.35rem' "$file"
            grep --fixed-strings --quiet 'minmax(12rem, 0.72fr) minmax(20rem, 1.28fr)' "$file"
            grep --fixed-strings --quiet 'box-shadow: 0 0 0 4px var(--rv-field-focus)' "$file"
          done

  canonical:
    name: Verify canonical profile-form hierarchy
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      STAGING_URL: https://rendezvue-private-preview.pages.dev/
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Wait for commit-matched canonical deployment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo '::error title=Invalid commit::EXPECTED_SHA is not a full Git commit.'
            exit 1
          }

          metadata="$RUNNER_TEMP/deployment.json"
          matched=false
          for attempt in {1..72}; do
            status="$(curl --silent --show-error --location \
              --output "$metadata" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}deployment.json?commit=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            if [[ "$status" == "200" ]] && node --input-type=module --eval "
              import { readFileSync } from 'node:fs';
              const document = JSON.parse(readFileSync(process.argv[1], 'utf8'));
              if (document.buildCommit !== process.argv[2]) process.exit(1);
              if (document.hostingPlatform !== 'cloudflare-pages') process.exit(1);
              if (document.remoteBackendConfigured !== true) process.exit(1);
              if (document.realUserAdmissionAuthorized !== false) process.exit(1);
            " "$metadata" "$EXPECTED_SHA"; then
              matched=true
              break
            fi
            echo "Canonical deployment is not commit-matched yet (attempt $attempt, HTTP $status)."
            sleep 10
          done
          [[ "$matched" == "true" ]] || {
            echo '::error title=Deployment did not converge::Canonical deployment was not commit-matched within the bounded verification window.'
            exit 1
          }

      - name: Verify delivered form hierarchy CSS
        shell: bash
        run: |
          set -euo pipefail
          stylesheet="$RUNNER_TEMP/product-shell.css"
          status="$(curl --silent --show-error --location \
            --output "$stylesheet" --write-out '%{http_code}' \
            --header 'cache-control: no-cache' \
            "${STAGING_URL}product-shell.css?commit=${EXPECTED_SHA}" || true)"
          [[ "$status" == "200" ]] || {
            echo "::error title=Canonical stylesheet missing::product-shell.css returned HTTP ${status}."
            exit 1
          }
          grep --fixed-strings --quiet 'WP-071: make the value the primary scan target' "$stylesheet"
          grep --fixed-strings --quiet '.rv-fieldset > label > span' "$stylesheet"
          grep --fixed-strings --quiet 'font-size: 0.78rem' "$stylesheet"
          grep --fixed-strings --quiet 'font-size: 1.03rem' "$stylesheet"
          grep --fixed-strings --quiet 'min-height: 3.35rem' "$stylesheet"
          grep --fixed-strings --quiet 'minmax(12rem, 0.72fr) minmax(20rem, 1.28fr)' "$stylesheet"
          grep --fixed-strings --quiet 'box-shadow: 0 0 0 4px var(--rv-field-focus)' "$stylesheet"
