name: Verify Cloudflare Pages staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-cloudflare-staging.yml'
      - '.github/workflows/configure-cloudflare-staging.yml'
      - 'apps/private-preview/**'
      - 'apps/web/src/auth-session.js'
      - 'apps/web/src/backend-contract.js'
      - 'apps/web/src/onboarding-repository.js'
      - 'config/wp075-email-otp-activation.json'
      - 'scripts/build-private-preview.mjs'
      - 'scripts/copy-product-assets.mjs'
      - 'scripts/finalize-wp075-email-otp-artifact.mjs'
      - 'scripts/validate-private-preview.mjs'
      - 'scripts/validate-wp066-account-experience.mjs'
      - 'scripts/validate-wp067-product-shell.mjs'
      - 'scripts/validate-wp075-email-otp.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rendezvue-cloudflare-production-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_URL: https://rendezvue-private-preview.pages.dev/

    steps:
      - name: Wait for commit-matched deployment metadata
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/deployment.json"
          matched=false

          for attempt in {1..72}; do
            status="$(curl --silent --show-error --location \
              --output "$metadata" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}deployment.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"

            if [[ "$status" == "200" ]]; then
              if node --input-type=module --eval "
                import { readFileSync } from 'node:fs';
                const document = JSON.parse(readFileSync(process.argv[1], 'utf8'));
                const expected = process.argv[2];
                const allowedSources = new Set(['environment', 'previous-canonical-deployment']);
                if (document.hostingPlatform !== 'cloudflare-pages') process.exit(1);
                if (document.canonicalUrl !== 'https://rendezvue-private-preview.pages.dev/') process.exit(1);
                if (document.buildCommit !== expected) process.exit(1);
                if (document.configurationMode !== 'remote-supabase') process.exit(1);
                if (!allowedSources.has(document.configurationSource)) process.exit(1);
                if (document.remoteBackendConfigured !== true) process.exit(1);
                if (document.authFlow !== 'pkce-magic-link-cloudflare-staging') process.exit(1);
                if (document.pkceCodeCallbacksAccepted !== true) process.exit(1);
                if (document.implicitTokenFragmentsAccepted !== false) process.exit(1);
                if (document.realUserAdmissionAuthorized !== false) process.exit(1);
                if (document.emailOtpImplementationPresent !== true) process.exit(1);
                if (document.automaticCrossBrowserSessionPropagation !== false) process.exit(1);
                if (document.passwordAuthentication !== false) process.exit(1);
                if (document.desiredEmailOtpDigits !== 6 || document.desiredEmailOtpExpirySeconds !== 600) process.exit(1);
                const ready = document.emailOtpHostedDeliveryReady === true;
                if (ready) {
                  if (document.emailOtpActivationState !== 'active-hosted-email-otp') process.exit(1);
                  if (document.passwordlessPrimary !== 'email-otp') process.exit(1);
                  if (document.crossBrowserEmailOtp !== true) process.exit(1);
                  if (document.emailOtpDigits !== 6 || document.emailOtpExpirySeconds !== 600) process.exit(1);
                } else {
                  if (document.emailOtpActivationState !== 'blocked-external-mail-provider') process.exit(1);
                  if (document.passwordlessPrimary !== 'pkce-magic-link') process.exit(1);
                  if (document.crossBrowserEmailOtp !== false) process.exit(1);
                  if (document.emailOtpDigits !== null || document.emailOtpExpirySeconds !== null) process.exit(1);
                }
              " "$metadata" "$GITHUB_SHA"; then
                matched=true
                break
              fi
            fi

            echo "Cloudflare production is not commit-matched with a truthful remote-supabase deployment yet (attempt $attempt, HTTP $status)."
            sleep 10
          done

          if [[ "$matched" != "true" ]]; then
            echo '::error title=Cloudflare deployment did not converge::Production deployment.json did not match the pushed commit and current authentication availability contract within 12 minutes.'
            [[ -f "$metadata" ]] && cat "$metadata" || true
            exit 1
          fi

          node --input-type=module --eval "
            import { readFileSync } from 'node:fs';
            const document = JSON.parse(readFileSync(process.argv[1], 'utf8'));
            const out = process.env.GITHUB_OUTPUT;
            const lines = [
              ['configuration_source', document.configurationSource],
              ['passwordless_primary', document.passwordlessPrimary],
              ['email_otp_ready', String(document.emailOtpHostedDeliveryReady === true)],
              ['email_otp_state', document.emailOtpActivationState]
            ];
            const { appendFileSync } = await import('node:fs');
            appendFileSync(out, lines.map(([key, value]) => `${key}=${value}\n`).join(''));
          " "$metadata"
          echo "deployment_url=${STAGING_URL}deployment.json" >> "$GITHUB_OUTPUT"
          cat "$metadata"

      - name: Verify product application, assets and security headers
        shell: bash
        run: |
          set -euo pipefail

          fetch_artifact() {
            local relative_path="$1"
            local destination="$2"
            local status
            status="$(curl --silent --show-error --location \
              --output "$destination" --write-out '%{http_code}' \
              --header 'cache-control: no-cache' \
              "${STAGING_URL}${relative_path}?commit=${GITHUB_SHA}" || true)"
            if [[ "$status" != "200" ]]; then
              echo "::error title=Cloudflare artifact missing::${relative_path} returned HTTP ${status}."
              exit 1
            fi
          }

          require_marker() {
            local file="$1"
            local marker="$2"
            local label="$3"
            if ! grep -Fq "$marker" "$file"; then
              echo "::error title=Cloudflare product marker missing::${label} is missing ${marker}."
              exit 1
            fi
          }

          index="$RUNNER_TEMP/index.html"
          account_shell="$RUNNER_TEMP/account-shell.js"
          product_shell="$RUNNER_TEMP/product-shell.js"
          conversation_controller="$RUNNER_TEMP/conversation-inbox-controller.js"
          product_model="$RUNNER_TEMP/product-model.js"
          product_css="$RUNNER_TEMP/product-shell.css"
          portrait_manifest="$RUNNER_TEMP/profile-manifest.json"

          fetch_artifact '' "$index"
          fetch_artifact 'account-shell.js' "$account_shell"
          fetch_artifact 'product-shell.js' "$product_shell"
          fetch_artifact 'conversation-inbox-controller.js' "$conversation_controller"
          fetch_artifact 'product-model.js' "$product_model"
          fetch_artifact 'product-shell.css' "$product_css"
          fetch_artifact 'assets/profiles/manifest.json' "$portrait_manifest"

          require_marker "$index" 'CLOUDFLARE STAGING' 'advanced synthetic-test boundary'
          require_marker "$index" 'magic-link-form' 'account entry form'
          require_marker "$index" 'Aanmeldlink sturen' 'Dutch existing-account action'
          require_marker "$index" 'advanced-tools' 'advanced proof disclosure'
          require_marker "$index" './account-shell.js' 'account-shell module reference'
          require_marker "$account_shell" "import './product-shell.js';" 'integrated product-shell import'
          require_marker "$account_shell" 'rendezvue:language-change' 'shared language-change event'
          require_marker "$product_shell" 'rendezvue-product-app' 'integrated signed-in product application'
          require_marker "$product_shell" 'record_attraction_signal' 'server-authoritative discovery action'
          require_marker "$product_shell" 'createConversationInboxController' 'current conversation controller integration'
          require_marker "$conversation_controller" 'open_match_conversation' 'server-authoritative conversation action'
          require_marker "$conversation_controller" 'postgres_changes' 'Realtime message subscription'
          require_marker "$conversation_controller" 'create_safety_report' 'participant safety report action'
          require_marker "$product_shell" 'operator-synthetic-only' 'operator proof boundary'
          require_marker "$product_model" 'derivePartnerSex' 'derived opposite-sex discovery policy'
          require_marker "$product_model" 'projectDiscoveryProfile' 'product-safe discovery projection'
          require_marker "$product_css" '.rv-nav' 'mobile product navigation'
          require_marker "$product_css" '.rv-discovery-card' 'product discovery cards'
          require_marker "$product_css" '.rv-bubble' 'product conversation bubbles'

          node --input-type=module --eval "
            import { readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync(process.argv[1], 'utf8'));
            const expected = ['yasmin','bilal','amina','idris','maryam','samir','noura','youssef','hafsa','omar'];
            if (manifest.syntheticOnly !== true) throw new Error('portrait manifest is not synthetic-only');
            if (manifest.count !== expected.length) throw new Error('portrait manifest count is not ten');
            if (JSON.stringify(manifest.names) !== JSON.stringify(expected)) throw new Error('portrait manifest names differ');
          " "$portrait_manifest"

          portrait_headers="$RUNNER_TEMP/portrait-headers.txt"
          portrait_status="$(curl --silent --show-error --location --head \
            --output "$portrait_headers" --write-out '%{http_code}' \
            --header 'cache-control: no-cache' \
            "${STAGING_URL}assets/profiles/yasmin.webp?commit=${GITHUB_SHA}" || true)"
          [[ "$portrait_status" == "200" ]] || {
            echo "::error title=Synthetic product asset missing::Yasmin portrait returned HTTP ${portrait_status}."
            exit 1
          }
          grep -Eiq '^content-type:[[:space:]]*image/webp' "$portrait_headers" || {
            echo '::error title=Synthetic product asset type invalid::Yasmin portrait is not served as image/webp.'
            exit 1
          }

          if grep -q 'Branchpreview zonder backend' "$index"; then
            echo '::error title=Placeholder deployment::Production is serving the non-functional branch-preview artifact.'
            exit 1
          fi
          if [[ '${{ steps.deployment.outputs.email_otp_ready }}' == 'true' ]]; then
            require_marker "$index" "./email-otp-controller.js?commit=${GITHUB_SHA}" 'active hosted e-mail OTP controller'
          elif grep -Fq 'email-otp-controller.js' "$index"; then
            echo '::error title=Unavailable auth mode::Canonical staging loads the OTP controller while hosted OTP delivery is not ready.'
            exit 1
          fi
          if grep -Eiq 'Hugging Face|static\.hf\.space' "$index"; then
            echo '::error title=Stale hosting reference::Production index still references Hugging Face.'
            exit 1
          fi
          if grep -Eiq 'service_role|sb_secret_|SUPABASE_SERVICE_ROLE_KEY|execute-account-email-replacement' "$product_shell" "$conversation_controller"; then
            echo '::error title=Privileged browser capability exposed::Product browser modules contain prohibited privileged material.'
            exit 1
          fi

          headers="$RUNNER_TEMP/runtime-headers.txt"
          curl --silent --show-error --location --head \
            --header 'cache-control: no-cache' \
            "${STAGING_URL}runtime-config.js?commit=${GITHUB_SHA}" > "$headers"
          grep -Eiq '^cache-control:.*no-store' "$headers" || {
            echo '::error title=Runtime cache contract failed::runtime-config.js is not served with no-store.'
            exit 1
          }
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$headers" || {
            echo '::error title=Security header missing::X-Content-Type-Options nosniff is absent.'
            exit 1
          }
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' "$headers" || {
            echo '::error title=Security header missing::X-Frame-Options DENY is absent.'
            exit 1
          }

      - name: Write verification summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Rendezvue Cloudflare Pages staging

          - Canonical URL: $STAGING_URL
          - Commit matched: \`$GITHUB_SHA\`
          - Supabase configuration: remote, not placeholder
          - Configuration source: \`${{ steps.deployment.outputs.configuration_source }}\`
          - Account entry and recovery shell: passed
          - Integrated onboarding/discovery/conversation shell: passed
          - Conversation architecture: WP-073 inbox controller verified
          - Ten synthetic product portraits and manifest: passed
          - Active passwordless path: \`${{ steps.deployment.outputs.passwordless_primary }}\`
          - Hosted e-mail OTP ready: \`${{ steps.deployment.outputs.email_otp_ready }}\`
          - OTP activation state: \`${{ steps.deployment.outputs.email_otp_state }}\`
          - Implicit access/refresh token fragments: disabled
          - Runtime configuration cache: no-store
          - Security headers: passed
          - Privileged browser capability scan: passed
          - Hugging Face runtime reference: absent
          - Real-user admission authorized: no
          EOF

      - name: Record production deployment evidence
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 35 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## Cloudflare Pages product deployment verified

          - canonical URL: $STAGING_URL
          - commit: \`$GITHUB_SHA\`
          - workflow: $RUN_URL
          - deployment metadata: commit-matched and auth-availability-consistent
          - Supabase configuration: remote, not placeholder
          - configuration source: \`${{ steps.deployment.outputs.configuration_source }}\`
          - account entry/recovery shell: passed
          - integrated onboarding/discovery/conversation shell: passed against current WP-073 controller architecture
          - synthetic portrait asset manifest and delivery: passed
          - active passwordless path: \`${{ steps.deployment.outputs.passwordless_primary }}\`
          - hosted e-mail OTP ready: \`${{ steps.deployment.outputs.email_otp_ready }}\`
          - OTP activation state: \`${{ steps.deployment.outputs.email_otp_state }}\`
          - implicit access/refresh token fragments: disabled
          - runtime no-store and security headers: passed
          - privileged browser capability scan: passed
          - Hugging Face runtime dependency: absent
          - real-user admission: not authorized
          EOF

      - name: Record production verification failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 35 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          ## Cloudflare Pages product verification failed

          - canonical URL: $STAGING_URL
          - expected commit: \`$GITHUB_SHA\`
          - workflow: $RUN_URL
          - result: deployment metadata/auth availability, account/product markers, current conversation-controller markers, synthetic assets, privileged-capability scan or security headers did not pass
          - action: inspect the linked run; no canonical product deployment success is claimed
          - real-user admission: not authorized
          EOF
