name: Verify WP-065E support decisions staging

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-account-support-decisions-staging.yml'
      - 'scripts/verify-wp065e-decisions-staging.sh'
      - 'supabase/migrations/20260803202500_account_support_identity_evidence_decisions.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-account-support-decisions-staging.yml'
      - 'scripts/verify-wp065e-decisions-staging.sh'
      - 'supabase/migrations/20260803202500_account_support_identity_evidence_decisions.sql'
  workflow_run:
    workflows: ['Configure Cloudflare staging backend']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rendezvue-wp065e-decisions-verifier-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate WP-065E verifier contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate shell syntax and non-destructive boundary
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/verify-wp065e-decisions-staging.sh'
          bash -n "$script"

          required=(
            'read_only: true'
            'evidence_count'
            'decision_count'
            'decision_event_count'
            'service_role_can_insert_evidence'
            'service_role_can_review_decisions'
            'dangerous_function_count'
          )
          for marker in "${required[@]}"; do
            grep --fixed-strings --quiet "$marker" "$script" || {
              echo "::error title=Missing verifier marker::$marker"
              exit 1
            }
          done

          forbidden=(
            'delete[[:space:]]+from'
            'truncate[[:space:]]+'
            'drop[[:space:]]+table'
            'update[[:space:]]+auth\.users'
            'insert[[:space:]]+into[[:space:]]+auth\.users'
            'select[[:space:]]+public\.register_account_support_evidence'
            'select[[:space:]]+public\.propose_account_support_decision'
            'select[[:space:]]+public\.review_account_support_decision'
            'supabase[[:space:]]+db[[:space:]]+reset[[:space:]]+--linked'
          )
          for pattern in "${forbidden[@]}"; do
            if grep --extended-regexp --ignore-case --quiet "$pattern" "$script"; then
              echo "::error title=Unsafe verifier pattern::$pattern"
              exit 1
            fi
          done

  verify:
    name: Verify protected Supabase WP-065E state
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: rendezvue-private-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate protected verifier configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || {
            echo '::error title=Missing token::SUPABASE_ACCESS_TOKEN is not configured'
            exit 1
          }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]] || {
            echo '::error title=Invalid project reference::SUPABASE_PROJECT_REF has an unexpected format'
            exit 1
          }

      - name: Verify remote evidence and dual-control decision state
        shell: bash
        run: bash scripts/verify-wp065e-decisions-staging.sh

      - name: Write verification summary
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065E remote evidence and decision verification' \
            '' \
            '- Evidence/decision schema: present' \
            '- Evidence/decisions/events: 0 / 0 / 0' \
            '- Anonymous/authenticated access: denied' \
            '- Service-role direct table writes: denied' \
            '- Service-role controlled evidence/proposal/review functions: allowed' \
            '- Merge, Auth restoration, e-mail change, deletion or action-execution functions: absent' \
            '- Real-user admission authorized: no' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful WP-065E verification
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065E remote verification passed' \
            '' \
            "- commit: \`$GITHUB_SHA\`" \
            "- workflow: $RUN_URL" \
            '- evidence/decision schema: present' \
            '- evidence/decisions/events: 0 / 0 / 0' \
            '- anonymous/authenticated access: denied' \
            '- service-role direct writes: denied' \
            '- service-role controlled evidence/proposal/review functions: allowed' \
            '- account merge/Auth restoration/e-mail change/deletion/action execution: absent' \
            '- approved-for-action remains classification-only' \
            '- real-user admission: not authorized' \
            | gh issue comment 65 --repo "$GITHUB_REPOSITORY" --body-file -

      - name: Record failed WP-065E verification
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065E remote verification failed' \
            '' \
            "- commit: \`$GITHUB_SHA\`" \
            "- workflow: $RUN_URL" \
            '- result: schema, empty-state, privilege, controlled-function or forbidden-mutation contract did not pass' \
            '- no account mutation is authorized' \
            '- real-user admission remains unauthorized' \
            | gh issue comment 65 --repo "$GITHUB_REPOSITORY" --body-file -
