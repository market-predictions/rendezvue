name: Apply WP073 governance records

on:
  push:
    branches:
      - ux/wp073-conversation-inbox
    paths:
      - '.github/workflows/patch-wp073-governance.yml'
      - 'scripts/patch-wp073-governance.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Record WP-073 governance
        run: python scripts/patch-wp073-governance.py

      - name: Revalidate application and artifact
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_00000000000000000000
        run: |
          npm ci
          npm test
          npm run validate:synthetic-seed
          npm run build:cloudflare
          node --check apps/private-preview/conversation-inbox-controller.js
          grep --fixed-strings --quiet 'WP-073: scalable match and conversation inbox' dist-private-preview/product-shell.css

      - name: Commit governance records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/ROADMAP.md docs/WORKPACKAGES.md docs/WORK-CLAIMS.md docs/HANDOVER.md
          git commit -m 'Document WP-073 conversation inbox'
          git push origin "HEAD:${GITHUB_REF_NAME}"
