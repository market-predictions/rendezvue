name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run application and artifact checks
        id: app_checks
        continue-on-error: true
        run: npm run check > check.log 2>&1
      - name: Report check failure on pull request
        if: steps.app_checks.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### CI application check failed"
            echo
            echo '```text'
            tail -n 80 check.log
            echo '```'
          } > ci-comment.md
          gh pr comment "$PR_NUMBER" --body-file ci-comment.md
      - name: Fail after publishing check evidence
        if: steps.app_checks.outcome == 'failure'
        run: |
          tail -n 80 check.log
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/huggingface_space.py
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: docker build -t rendezvue-pilot:${{ github.sha }} .
