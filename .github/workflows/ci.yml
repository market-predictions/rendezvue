name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run application and artifact checks
        id: app_checks
        continue-on-error: true
        run: npm run check > check.log 2>&1
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-check-log
          path: check.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail after preserving check evidence
        if: steps.app_checks.outcome == 'failure'
        run: |
          tail -n 80 check.log
          exit 1
      - run: docker build -t rendezvue-pilot:${{ github.sha }} .

  wp074_acceptance:
    name: WP074 protected acceptance
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'trigger WP-074 protected acceptance v4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: rendezvue-private-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      STAGING_URL: https://rendezvue-private-preview.pages.dev/
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Run protected acceptance
        run: bash scripts/run-wp074-protected-acceptance.sh
