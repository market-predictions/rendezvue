name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run application and artifact checks
        id: app_checks
        continue-on-error: true
        run: npm run check > check.log 2>&1
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-check-log
          path: check.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail after preserving check evidence
        if: steps.app_checks.outcome == 'failure'
        run: |
          tail -n 80 check.log
          exit 1
      - run: docker build -t rendezvue-pilot:${{ github.sha }} .
