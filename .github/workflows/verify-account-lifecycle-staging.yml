name: Verify WP-065 lifecycle staging

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-account-lifecycle-staging.yml'
      - 'scripts/verify-wp065-lifecycle-staging.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-account-lifecycle-staging.yml'
      - 'scripts/verify-wp065-lifecycle-staging.sh'
      - 'supabase/migrations/20260803134500_account_lifecycle_retention_candidates.sql'
  workflow_run:
    workflows: ['Configure Cloudflare staging backend']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rendezvue-wp065-lifecycle-verifier-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate lifecycle verifier contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate shell syntax and read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/verify-wp065-lifecycle-staging.sh'
          bash -n "$script"

          required=(
            'read_only: true'
            'active_policy_count'
            'candidate_count'
            'anon_can_enumerate'
            'authenticated_can_enumerate'
            'service_role_can_enumerate'
          )
          for marker in "${required[@]}"; do
            grep --fixed-strings --quiet "$marker" "$script" || {
              echo "::error title=Missing verifier marker::$marker"
              exit 1
            }
          done

          forbidden=(
            'delete[[:space:]]+from'
            'truncate[[:space:]]+'
            'drop[[:space:]]+table'
            'supabase[[:space:]]+db[[:space:]]+reset[[:space:]]+--linked'
            'select[[:space:]]+\*[[:space:]]+from[[:space:]]+public\.list_account_retention_candidates'
          )
          for pattern in "${forbidden[@]}"; do
            if grep --extended-regexp --ignore-case --quiet "$pattern" "$script"; then
              echo "::error title=Unsafe verifier pattern::$pattern"
              exit 1
            fi
          done

  verify:
    name: Verify protected Supabase lifecycle state
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: rendezvue-private-preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate protected verifier configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || {
            echo '::error title=Missing token::SUPABASE_ACCESS_TOKEN is not configured'
            exit 1
          }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{15,30}$ ]] || {
            echo '::error title=Invalid project reference::SUPABASE_PROJECT_REF has an unexpected format'
            exit 1
          }

      - name: Verify remote lifecycle objects and disabled policy
        shell: bash
        run: bash scripts/verify-wp065-lifecycle-staging.sh

      - name: Write verification summary
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065 remote lifecycle verification' \
            '' \
            '- Lifecycle schema: present' \
            '- Active retention policy: none' \
            '- Cleanup candidates: none' \
            '- Anonymous enumeration: denied' \
            '- Authenticated enumeration: denied' \
            '- Service-role enumeration: allowed' \
            '- Delete function or scheduler introduced: no' \
            '- Real-user admission authorized: no' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful lifecycle verification
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065 remote lifecycle verification passed' \
            '' \
            "- commit: \`$GITHUB_SHA\`" \
            "- workflow: $RUN_URL" \
            '- lifecycle schema: present' \
            '- active retention policies: 0' \
            '- cleanup candidates: 0' \
            '- anonymous/authenticated candidate enumeration: denied' \
            '- service-role candidate enumeration: allowed' \
            '- destructive cleanup or scheduler: absent' \
            '- real-user admission: not authorized' \
            | gh issue comment 54 --repo "$GITHUB_REPOSITORY" --body-file -

      - name: Record lifecycle verification failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf '%s\n' \
            '## WP-065 remote lifecycle verification failed' \
            '' \
            "- commit: \`$GITHUB_SHA\`" \
            "- workflow: $RUN_URL" \
            '- result: verifier runtime, lifecycle schema, disabled-policy, zero-candidate or privilege contract did not pass' \
            '- destructive cleanup remains unauthorized' \
            '- real-user admission remains unauthorized' \
            | gh issue comment 54 --repo "$GITHUB_REPOSITORY" --body-file -
