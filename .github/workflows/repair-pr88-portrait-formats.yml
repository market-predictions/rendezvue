name: Repair PR88 portrait formats

on:
  push:
    branches:
      - assets/realistic-synthetic-portraits

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out portrait branch
        uses: actions/checkout@v6
        with:
          ref: assets/realistic-synthetic-portraits
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Convert uploaded images to genuine WebP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('synthetic-seed/portraits')
          names = ('yasmin', 'bilal', 'amina', 'idris', 'maryam', 'samir', 'noura', 'youssef', 'hafsa', 'omar')

          for name in names:
              path = root / f'{name}.webp'
              with Image.open(path) as source:
                  source.load()
                  original_format = source.format
                  if source.width < 600 or source.height < 750:
                      raise SystemExit(f'{path}: portrait is too small: {source.size}')
                  image = source.convert('RGB')

              temporary = path.with_suffix('.converted.webp')
              image.save(temporary, format='WEBP', quality=86, method=6)
              temporary.replace(path)

              with Image.open(path) as verified:
                  verified.load()
                  if verified.format != 'WEBP':
                      raise SystemExit(f'{path}: expected WEBP, got {verified.format}')
                  print(f'{name}: {original_format} -> {verified.format}, {verified.size}, {path.stat().st_size} bytes')
          PY

      - name: Verify signatures and bounded delivery size
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('synthetic-seed/portraits')
          names = ('yasmin', 'bilal', 'amina', 'idris', 'maryam', 'samir', 'noura', 'youssef', 'hafsa', 'omar')
          for name in names:
              path = root / f'{name}.webp'
              data = path.read_bytes()
              if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{path}: invalid WebP signature')
              if len(data) > 900_000:
                  raise SystemExit(f'{path}: image remains too large for staging delivery: {len(data)} bytes')
          PY

      - name: Commit corrected binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add synthetic-seed/portraits/*.webp
          if git diff --cached --quiet; then
            echo 'No conversion changes were required.'
            exit 0
          fi
          git commit -m 'fix(assets): convert realistic portraits to genuine WebP'
          git push origin HEAD:assets/realistic-synthetic-portraits
