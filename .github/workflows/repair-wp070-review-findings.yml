name: Repair WP070 review findings

on:
  push:
    branches:
      - feature/wp070-profile-image-preparation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/wp070-profile-image-preparation
          fetch-depth: 0

      - name: Apply reviewed compatibility and observer fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260805084500_profile_image_preparation.sql')
          sql = migration.read_text()
          old = "alter table public.privacy_portraits\n  alter column preparation_id set not null,"
          new = "alter table public.privacy_portraits\n  alter column preparation_id set default gen_random_uuid(),\n  alter column preparation_id set not null,"
          if old not in sql:
              raise SystemExit('preparation default marker not found')
          migration.write_text(sql.replace(old, new, 1))

          controller = Path('apps/private-preview/profile-image-preparation.js')
          source = controller.read_text()
          old_block = '''function applyPreparedPreview() {
            if (!preparedCardUrl) return;
            const portraitPreview = document.querySelector('#rv-portrait-preview');
            if (portraitPreview) {
              const image = document.createElement('img');
              image.src = preparedCardUrl;
              image.alt = '';
              portraitPreview.replaceChildren(image);
              setBackdrop(portraitPreview, image);
            }
            const profileMedia = document.querySelector('#rv-profile-preview .rv-profile-preview-media');
            if (profileMedia) {
              const image = document.createElement('img');
              image.src = preparedCardUrl;
              image.alt = '';
              profileMedia.replaceChildren(image);
              setBackdrop(profileMedia, image);
            }
          }'''
          new_block = '''function ensurePreparedImage(container) {
            if (!container || !preparedCardUrl) return;
            let image = container.querySelector(':scope > img');
            if (image?.src !== preparedCardUrl) {
              image = document.createElement('img');
              image.src = preparedCardUrl;
              image.alt = '';
              container.replaceChildren(image);
            }
            setBackdrop(container, image);
          }

          function applyPreparedPreview() {
            if (!preparedCardUrl) return;
            ensurePreparedImage(document.querySelector('#rv-portrait-preview'));
            ensurePreparedImage(document.querySelector('#rv-profile-preview .rv-profile-preview-media'));
          }'''
          if old_block not in source:
              raise SystemExit('prepared preview marker not found')
          controller.write_text(source.replace(old_block, new_block, 1))
          PY

      - name: Verify repaired markers
        run: |
          set -euo pipefail
          grep -Fq 'alter column preparation_id set default gen_random_uuid()' supabase/migrations/20260805084500_profile_image_preparation.sql
          grep -Fq 'function ensurePreparedImage(container)' apps/private-preview/profile-image-preparation.js
          node --check apps/private-preview/profile-image-preparation.js

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260805084500_profile_image_preparation.sql apps/private-preview/profile-image-preparation.js
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'fix(images): apply WP-070 internal review findings'
          git push origin HEAD:feature/wp070-profile-image-preparation
