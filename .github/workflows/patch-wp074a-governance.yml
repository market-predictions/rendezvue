name: Apply WP074A governance documentation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-wp074a-governance.yml'
      - 'scripts/patch-wp074a-governance.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply governance records once
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if grep --fixed-strings --quiet 'Privacy portrait recognisability recalibration' CHANGELOG.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'WP-074A governance records already applied.'
          else
            python scripts/patch-wp074a-governance.py
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit governance records
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/ROADMAP.md docs/WORKPACKAGES.md docs/WORK-CLAIMS.md docs/HANDOVER.md
          git commit -m 'Document WP-074A recognisability recalibration'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
