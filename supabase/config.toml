project_id = "rendezvue"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://localhost:4173", "http://127.0.0.1:4174", "http://localhost:4174"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.delete-private-proof-account]
# Authentication is handled inside the function with @supabase/server so the
# same user-auth pattern works with the current publishable/asymmetric key model.
verify_jwt = false

[functions.execute-account-email-replacement]
# Internal service authorization is validated inside the function. Browser or
# ordinary authenticated-user calls are rejected before any database action.
verify_jwt = false
